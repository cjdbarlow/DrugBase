class: Naturally occurring purine nucleoside
chemistry:
dose: 3mg/6mg/12mg IV in increasing doses
pharmaceutics:
    presentation:
        - Colourless solution at 3mg/mL
    compatibility:
    solubility:
pharmacokinetics:
    absorption:
    distribution:
        pKa:
