---
aliases:
    - Lyrica
class: Anticonvulsant; neuropathic analgesic
chemistry: S-enantiomer GABA analogue; amino acid
dose:
    Neuropathic pain (PO): 75mg BD; ↑ to 150mg BD after 3-7 days; max 300mg BD
    Epilepsy (PO): 75mg BD; ↑ to 150mg BD after 1 week; max 300mg BD
pharmaceutics:
    presentation: 25mg, 75mg, 150mg and 300mg capsules
    compatibility:
    solubility: Freely water-soluble
pharmacokinetics:
    absorption: Rapid; bioavailability ≥90%; peak 1 hour; food ↓ rate but not extent
    distribution:
        pKa:
        vd: 0.56L/kg
        protein binding: Nil
    metabolism:
        half-life: 6.3 hours
        duration:
        pathway: Negligible metabolism
        metabolites:
            - N-methylpregabalin (0.9%)
    elimination:
        renal: 98% unchanged
mechanism:
    target:
        - α2δ subunit of presynaptic voltage-gated Ca2+ channels
    action: ↓ Release of glutamate, noradrenaline and substance P
contraindications:
pregnancy:
    code: D
    justification: ↑ Major congenital malformations (5.9% vs 4.1% unexposed)
pharmacodynamics:
    resp:
        - Respiratory depression
    cvs:
        - Peripheral oedema
    cns:
        - Anticonvulsant
        - Neuropathic analgesia
        - Dizziness, somnolence and confusion
    endo:
    msk:
    met:
        - Weight gain
    ren:
    gu:
    git:
        - Nausea, constipation and diarrhoea
    haeme:
considerations:
    - Renal impairment → dose reduction; haemodialysis removes ~50% in 4 hours
    - Opioids/CNS depressants → ↑ sedation, respiratory depression, coma and death
    - Misuse, dependence and withdrawal
    - Gradual withdrawal over ≥1 week
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Viatris Pty Ltd. LYRICA Australian Product Information. Revised 22 May 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
