---
aliases:
    - Albuterol
    - Ventolin
class: Short-acting selective β2 agonist
chemistry: Synthetic sympathomimetic amine
dose:
    MDI: 100-200microg inhaled
    Nebulised: 5mg inhaled Q4-6H
    Infusion (IV): 0.5microg/kg/min
pharmaceutics:
    presentation: MDI 100microg/puff; nebules 2.5mg/2.5mL or 5mg/2.5mL; injection 5mg/5mL
    compatibility: Nebules must not be injected; dilute IV concentrate before bolus injection
    solubility: Salbutamol sulfate is water soluble
pharmacokinetics:
    absorption: ~10% of inhaled dose deposited in lung; swallowed fraction undergoes first-pass metabolism
    distribution:
        pKa: 9.3 and 10.3
        vd: 1.3L/kg
        protein binding: Low
    metabolism:
        half-life: 2.7-5h (inhaled/PO)
        duration: Inhaled onset 5-15min; peak 60-90min; duration 3-6h
        pathway: Hepatic sulfation, oxidative deamination and glucuronidation; intestinal first-pass sulfation; not metabolised in lung
        metabolites:
            - Inactive salbutamol 4'-O-sulfate
    elimination:
        renal: ~72% within 24h as unchanged drug and metabolites; small faecal fraction
mechanism:
    target:
        - β2 adrenoceptors
    action: Gs activation → ↑ adenylyl cyclase → ↑ cAMP → bronchial smooth-muscle relaxation
contraindications:
    - 'Non-IV formulations: not for arresting uncomplicated premature labour or threatened abortion'
    - 'IV: antepartum haemorrhage'
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - Bronchodilation
        - ↓ HPV → ↑ shunt and possible ↓ PaO2 without supplemental O2
    cvs:
        - ↑ HR at high doses; ↓ MAP from peripheral vasodilation
    cns:
        - Insomnia
    endo:
        - Hyperinsulinaemia and hyperglycaemia
    msk:
        - Tremor, muscle cramps; potentiates non-depolarising NMBs
    met:
        - Hypokalaemia; hyperglycaemia
        - Lactic acidosis with high-dose IV/nebulised therapy
    ren:
    gu:
        - Uterine relaxation
    git:
    haeme:
considerations:
    - Increasing use may indicate worsening asthma
    - β blockers antagonise bronchodilation
    - Hypokalaemia may be potentiated by xanthines, corticosteroids and diuretics
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - GlaxoSmithKline Australia Pty Ltd. VENTOLIN NEBULES Australian Product Information. Version 7.0. Revised 30 June 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
