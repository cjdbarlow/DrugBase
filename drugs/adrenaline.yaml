---
aliases:
    - Epinephrine
class: Inotrope
chemistry: Endogenous catecholamine
dose:
    arrest: 1mg IV Q3-5 min
    shock: 0.05-2µg/kg/min IV
    anaphylaxis:
        - "No IV access: 500μg IM Q5 min"
        - "Grade II: 20μg IV"
        - "Grade III: 100-200μg IV"
    airway oedema: 5mg neb
    push dose: 5-10µg
pharmaceutics:
    presentation: Clear colourless 1mg/mL or 0.1mg/mL solution; light-sensitive; sodium metabisulfite
    solubility: Minimal water solubility
pharmacokinetics:
    absorption:
        - No PO bioavailability due to destruction by COMT and MAO in the gut brush border
        - Variable ETT and SC absorption
    distribution:
        pKa: 9.69
        vd: 0.1-0.2L/kg
        protein binding: 12%
    metabolism:
        half-life: 2 minutes
        duration: Very short; rapid onset
        pathway: Rapid COMT and MAO metabolism in liver, tissues and sympathetic nerves
        metabolites:
            - VMA
            - Metadrenaline
    elimination:
        renal: Metabolites
mechanism:
    target:
        - α1 adrenoreceptor
        - α2 adrenoreceptor
        - β1 adrenoreceptor
        - β2 adrenoreceptor
    action: β > α at low doses; α1 dominates at high doses
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - ↑ MV
        - Bronchodilation
    cvs:
        - ↑ Inotropy
        - ↑ HR
       - ↑ SVR and PVR
        - ↑ BP
        - ↑ CO
        - ↑ Myocardial O2 consumption
        - Coronary vasodilation
        - Arrhythmogenic
    cns:
        - ↑ Pain threshold
        - ↑ MAC
    endo:
    msk:
        - Necrosis with extravasation
    met:
        - ↑ BMR
        - ↑ Lipolysis
        - ↑ Gluconeogenesis and BSL
        - ↑ Lactate
        - Initially ↑ insulin secretion (β), then ↓ (α)
    ren:
        - ↓ RBF
    gu:
        - ↑ Sphincter tone
    git:
    haeme:
considerations:
    - Correct hypovolaemia, hypoxia, hypercapnia and acidosis
    - TCA/MAOI → ↑ effect
    - May worsen dynamic LVOT obstruction
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Aspen Pharmacare Australia Pty Ltd. Aspen Adrenaline Injection Australian Product Information. Revised 20 November 2019.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
