---
aliases: Tambocor
class: Class Ic antiarrhythmic
chemistry: Monocarboxylic acid amide (benzamide); racemate
dose:
    SVT/VT (IV): 2mg/kg (up to 150mg) over 10-30 minutes; infusion 1.5mg/kg/hr
    SVT (PO): 50mg BD; max 300mg/day
    VT (PO): 100mg BD; max 400mg/day
pharmaceutics:
    presentation: 50mg or 100mg tablet; clear 150mg/15mL injection
    compatibility: 5% glucose only; chloride or alkaline solutions may precipitate
    solubility: Water-soluble
pharmacokinetics:
    absorption: 90-95% oral bioavailability; Tmax ~3 hours; no first-pass effect
    distribution:
        pKa: 9.3
        vd: 8.7 L/kg
        protein binding: 40%
    metabolism:
        half-life: 20 hours
        duration:
        pathway: Hepatic (70%); active metabolites
        metabolites:
            - Active metabolites
    elimination:
        renal: 30% excreted unchanged
mechanism:
    target:
        - Nav1.5 subunit of voltage-gated sodium channel
    action: Slow Na+ channel dissociation → use-dependent block → ↓ Phase 0 + conduction; minimal change in APD
contraindications:
    - Second/third-degree AV block without pacemaker
    - Bifascicular block without pacemaker
    - Cardiogenic shock
    - Post-MI asymptomatic PVCs or non-sustained VT
    - Severe renal/hepatic impairment without plasma monitoring
pharmacodynamics:
    resp:
    cvs:
        - ↑ PR/QRS; minimal ↑ QT; heart block
        - ↓ Inotropy; may precipitate CCF
        - Proarrhythmia
        - ↑ Pacing threshold
        - ↑ Defibrillation energy requirement
    cns:
        - Dizziness
        - Visual disturbance
        - Paraesthesia
        - Headache
    endo:
    msk:
    met:
    ren:
    gu:
    git:
        - Nausea
    haeme:
considerations:
    - ↑ Mortality in heart failure patients
    - Amiodarone → ↑ flecainide; halve flecainide dose
    - Renal impairment or alkaline urine → ↓ elimination
references:
    - iNova Pharmaceuticals (Australia) Pty Limited. Tambocor Australian Product Information. Revised 29 May 2019.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
