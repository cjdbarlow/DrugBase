aliases:
class: Angiotensin receptor blocker
chemistry: Imidazole analogue
dose:
pharmaceutics:
    presentation:
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 60-80% oral bioavailability; effects maximal ~1 hour after oral dose
    distribution:
        pKa: 4.1
        vd: 0.7 L/kg
        protein binding:
    metabolism:
        half-life:
        duration:
        pathway: 75% hepatic
        metabolites:
    elimination:
        renal: 25% excreted unchanged
mechanism:
    target:
        - AT1 receptor
    action: Competitive inhibition of AT1 receptor → blocks binding of angiotensin II → interrupts RAAS effects mediated via AT1 receptor.
contraindications:
pregnancy:
    code: D
    justification: 2nd/3rd-trimester RAAS blockade → fetal injury/death; 1st-trimester safety uncertain
pharmacodynamics:
    resp:
    cvs:
        - ↓ SVR
        - ↓ BP
        - Unaffected HR and baroreceptor reflex
        - ↑ Natriuresis
        - Vascular and myocardial remodelling (beneficial in CCF)
    cns:
    endo:
    msk:
    met:
    ren:
        - ↓ GFR
    gu:
    git:
    haeme:
considerations:
    - No bradykinin accumulation → no cough; better compliance than ACE inhibitors
    - AT1 receptor in cardiac tissue may be more comprehensively blocked than with ACE inhibitors (may improve cardiac outcomes)
    - AT2 receptor not blocked (may improve cardiac outcomes)
    - Lower incidence of angioedema compared with ACE-inhibitors
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
