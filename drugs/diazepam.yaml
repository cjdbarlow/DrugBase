---
aliases: Valium; Propam; Stesolid
class: Benzodiazepine
chemistry: Benzodiazepine
dose:
    Usual (IV/IM): 2-10mg every 3-4 hours
    Status epilepticus (IV): 5-10mg; repeat every 10-15 minutes (max 30mg)
pharmaceutics:
    presentation: Clear colourless-pale yellow solution 5mg/mL; 53% propylene glycol; 31% ethanol
    compatibility: Avoid dilution — precipitates and adsorbs to plastic
    solubility: "pKa 3.4; practically insoluble in water"
pharmacokinetics:
    absorption: 94% oral bioavailability; IM absorption slow and erratic
    distribution:
        pKa: 3.4
        vd: 0.8-1.0 L/kg
        protein binding: 98%
    metabolism:
        half-life: "t½β 20-48 hours; nordiazepam ~96 hours"
        duration:
        pathway: Hepatic CYP3A4/2C19 → nordiazepam, temazepam and oxazepam (active)
        metabolites: Nordiazepam, temazepam and oxazepam (active)
    elimination:
        renal: 70% renal (metabolites)
mechanism:
    target:
        - GABAA receptor
    action: Positive allosteric modulator at the α/γ interface of the GABAA receptor → ↑ affinity of GABAA for GABA → ↑ frequency of Cl- channel opening → ↑ Cl- conductance → hyperpolarisation and ↓ neuronal transmission
contraindications:
pregnancy:
    code: C
    justification: High-dose labour use → neonatal hypotonia, respiratory depression and hypothermia; prolonged use → withdrawal
pharmacodynamics:
    resp:
        - ↓ VT
        - ↑ RR
        - Apnoea
        - Respiratory response to raised CO2 flattened
    cvs:
        - ↓ SVR
        - ↓ SBP
        - ↓ DBP
        - ↑ HR
        - Typically stable CO
    cns:
        - Hypnosis
        - Sedation
        - Anterograde amnesia
        - Anticonvulsant
        - ↓ CBF
        - ↓ MAC
    endo:
        - ↓ Adrenergic stress response
    msk:
        - Skeletal muscle relaxation
    met:
    ren:
    gu:
    git:
    haeme:
considerations:
    - Long-acting active metabolites — accumulation risk
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
