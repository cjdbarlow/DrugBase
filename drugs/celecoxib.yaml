---
aliases: Celebrex
class: Selective COX-2 inhibitor
chemistry: Diarylheterocyclic sulfonamide
dose:
    Analgesia (PO): 100-200mg PO BD ≤5 days
pharmaceutics:
    presentation: 100mg or 200mg capsule
    compatibility:
    solubility: "pKa 11.1; practically insoluble in water"
pharmacokinetics:
    absorption: 60-80% oral bioavailability; Tmax 2-3 hours
    distribution:
        pKa: 11.1
        vd: 5-6 L/kg
        protein binding: 97%
    metabolism:
        half-life: 8-12 hours
        duration:
        pathway: CYP2C9 → hydroxycelecoxib → carboxycelecoxib and glucuronide; inactive
        metabolites: Hydroxycelecoxib; carboxycelecoxib; glucuronide (inactive)
    elimination:
        renal: 27% urine; 57% faeces; <1% unchanged
mechanism:
    target:
        - COX-2
    action: Selective COX-2 inhibition (30:1) → ↓ prostaglandin synthesis at sites of inflammation
contraindications:
    - NSAID-induced asthma or urticaria
    - Sulfonamide reaction
    - Active peptic ulcer or GI bleeding
    - Unstable IHD; MI or CVA within 3 months
    - NYHA II-IV heart failure
    - CABG perioperative pain
    - Severe renal or hepatic impairment
pharmacodynamics:
    resp:
        - Bronchospasm in NSAID-sensitive asthma
    cvs:
        - ↑ MI/CVA risk
        - ↑ BP; oedema; CCF exacerbation
    cns:
    endo:
    msk:
    met:
    ren:
        - ↓ GFR; AKI
    gu:
    git:
        - ↓ GI ulceration vs non-selective NSAIDs
    haeme:
        - No platelet inhibition at therapeutic concentrations
considerations:
    - CYP2C9 poor metabolisers → ↑ exposure
references:
    - Viatris Pty Ltd. Celebrex Australian Product Information. Revised 6 March 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
