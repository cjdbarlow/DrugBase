---
aliases:
    - Protamine sulfate
class: Heparin antidote
chemistry: Basic cationic protein derived from salmon sperm
dose:
    Heparin reversal: 1mg IV per 100IU UFH remaining; maximum 50mg at one time
pharmaceutics:
    presentation: 50mg/5mL solution for IV injection
    compatibility: Compatible with 0.9% NaCl and 5% glucose
    solubility: Water soluble
pharmacokinetics:
    absorption:
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life:
        duration:
        pathway:
        metabolites:
    elimination:
        renal:
mechanism:
    target:
        - Unfractionated heparin
    action: Ionic binding forms a stable inactive protamine-heparin complex
contraindications:
    - Hypersensitivity to protamine, including protamine in NPH insulin
pregnancy:
    code: B2
    justification:
pharmacodynamics:
    resp:
        - Bronchospasm and non-cardiogenic pulmonary oedema
    cvs:
        - Rapid administration → severe ↓ MAP
        - Acute pulmonary hypertension and RV failure
        - Bradycardia
    cns:
    endo:
    msk:
    met:
    ren:
    gu:
    git:
        - Nausea and vomiting
    haeme:
        - Reverses heparin
        - Excess dose → anticoagulation
considerations:
    - Give over ~10min
    - Reduce dose as time from heparin administration increases
    - Incompletely reverses LMWH anti-Xa activity
    - Rebound anticoagulation may occur
    - ↑ Reaction risk with prior protamine exposure, protamine insulin, fish allergy or vasectomy
