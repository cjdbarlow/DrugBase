---
aliases:
    - Valproate
    - Valproic acid
    - Epilim
class: Broad-spectrum anticonvulsant; mood stabiliser
chemistry: Branched-chain fatty acid
dose:
    Load (IV): Up to 10mg/kg over 3-5 minutes
    Infusion (IV): 1-2mg/kg/hour; max 2500mg/day
pharmaceutics:
    presentation: 400mg powder with 4mL water for injection; reconstitutes to 100mg/mL
    compatibility: Infuse at 4mg/mL, max 8mg/mL, in 0.9% NaCl, glucose 5% or glucose-saline; separate line
    solubility: pKa 4.8; sodium salt is water-soluble
pharmacokinetics:
    absorption: IV 100%; PO nearly 100%
    distribution:
        pKa: 4.8
        vd: 0.2L/kg
        protein binding: 90%; concentration-dependent
    metabolism:
        half-life: 9-18 hours
        duration:
        pathway: Hepatic glucuronidation 40-60%; beta-oxidation 30-40%; CYP oxidation remainder
        metabolites:
            - Active and inactive metabolites
    elimination:
        renal: 1-3% unchanged; remainder metabolites
mechanism:
    target:
        - Voltage-gated Na+ channels
        - GABA degradative enzymes
    action: Stabilises inactivated Na+ channels and inhibits GABA catabolism → ↑ brain GABA
contraindications:
    - Pregnancy unless no suitable alternative for epilepsy
    - Acute or chronic hepatic dysfunction
    - Urea-cycle disorder
    - Uncorrected systemic carnitine deficiency
    - Hepatic porphyria
    - POLG-related mitochondrial disorder
pregnancy:
    code: D
    justification: Contraindicated; dose-dependent malformations, 1-2% neural-tube defects and developmental disorders
pharmacodynamics:
    resp:
    cvs:
    cns:
        - Anticonvulsant
        - Mood stabilisation
        - Hyperammonaemic encephalopathy
    endo:
    msk:
    met:
        - Hyperammonaemia
        - Hypocarnitinaemia
    ren:
        - Fanconi syndrome
    gu:
    git:
        - Hepatotoxicity
        - Pancreatitis
    haeme:
        - Thrombocytopenia and platelet dysfunction
        - Coagulopathy
considerations:
    - Protein binding saturates → disproportionate ↑ free drug
    - Monitor LFT, FBC and coagulation
    - Altered consciousness, vomiting or ataxia → check ammonia
    - Carbapenems markedly ↓ valproate concentration
    - Inhibits CYP, glucuronidation and epoxide hydrolase; displaces protein-bound drugs
    - Valproate ↑ lamotrigine half-life and rash risk
    - Consider carnitine for symptomatic hypocarnitinaemia or hyperammonaemia
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - sanofi-aventis australia pty ltd. EPILIM IV Australian Product Information. Revised 23 June 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Wellington Regional Hospital ICU. Wellington ICU Drug Manual. 2nd Ed. 2013.
