---
aliases:
    - Viagra
    - Revatio
class: Pulmonary vasodilator
chemistry: Pyrazolopyrimidine
dose:
    PAH: 20mg PO TID
    PAH (unable PO): 10mg IV TID
    perioperative RVF: 25-50mg PO/NG 3-4 times/day
    erectile dysfunction: 25-100mg PO PRN 1h before; max OD
pharmaceutics:
    presentation: 20mg, 25mg, 50mg or 100mg tablets; 0.8mg/mL IV solution; pharmacopoeia also describes buccal spray
    compatibility:
    solubility: Sildenafil citrate 2.6mg/mL in water at 25°C
pharmacokinetics:
    absorption: 41% PO bioavailability; peak 30-120 minutes; high-fat meal delays peak 60 minutes and ↓ Cmax 29%
    distribution:
        pKa: 8.7
        vd: 105L (~1.5L/kg)
        protein binding: 96%
    metabolism:
        half-life: 3-5 hours; active metabolite ~4 hours
        duration: Vasodilation maximal ~1-2 hours post-dose
        pathway: Hepatic; CYP3A4 (primary) and CYP2C9
        metabolites:
            - N-desmethyl sildenafil (active; ~50% potency of parent)
    elimination:
        renal: Metabolites; ~80% faeces and ~13% urine
mechanism:
    target:
        - Phosphodiesterase 5 (PDE5)
    action: Inhibits PDE5-mediated cGMP hydrolysis → ↑ cGMP → pulmonary > systemic vasodilation
contraindications:
    - Nitrates or NO donors
    - Riociguat
    - Potent CYP3A4 inhibitors (REVATIO)
    - Severe hepatic impairment or BP <90/50mmHg
    - Recent stroke/MI or hereditary retinal disease
pregnancy:
    code: B1
    justification:
pharmacodynamics:
    resp:
    cvs:
        - ↓ PVR
        - ↓ SVR
        - ↓ BP
        - Reflex ↑ HR
    cns:
        - Headache
        - Visual disturbances (PDE6 inhibition in retina)
    endo:
    msk:
    met:
    ren:
    gu:
        - Priapism
    git:
    haeme:
considerations:
    - Inhaled NO → additive pulmonary vasodilation; use with caution
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
