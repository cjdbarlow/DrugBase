---
aliases: Nebilet
class: Highly β1-selective blocker; NO-mediated vasodilator
chemistry: Aryloxypropanolamine; racemate
dose:
    HTN (PO): 5mg OD; renal impairment/age >65 years 2.5mg OD → 5mg OD
    HF (PO): 1.25mg OD; double every 1-2 weeks; max 10mg OD
pharmaceutics:
    presentation: 1.25mg, 5mg or 10mg tablet
    compatibility:
    solubility: Good lipid solubility
pharmacokinetics:
    absorption: 12-96% oral bioavailability (varies with metaboliser status)
    distribution:
        pKa: 8.13
        vd: 11.2 L/kg
        protein binding: ~98%
    metabolism:
        half-life: 10-30 hours
        duration:
        pathway: Hepatic CYP2D6 hydroxylation, N-dealkylation and glucuronidation
        metabolites:
            - Active hydroxy-metabolites and glucuronides
    elimination:
        renal: 38% urine; 48% faeces; <0.5% unchanged in urine
mechanism:
    target:
        - β1 adrenoreceptor
        - Endothelial L-arginine/NO pathway
    action: d-nebivolol → β1 antagonism; l-nebivolol → NO-mediated vasodilation
contraindications:
    - Hepatic impairment
    - Acute/decompensated CCF or cardiogenic shock
    - Sinus bradycardia, sick sinus or SA block
    - Second/third-degree AV block without pacemaker
    - Asthma or bronchospasm
    - Untreated phaeochromocytoma
    - Metabolic acidosis
pregnancy:
    code: C
    justification: Fetal/neonatal bradycardia
pharmacodynamics:
    resp:
    cvs:
        - ↓ HR
        - ↓ Inotropy
        - ↓ MVO2
        - ↓ MAP
        - ↓ SVR
        - ↑ NO-mediated vasodilation
    cns:
        - Tiredness/nightmares/sleep disturbance
    endo:
    msk:
    met:
        - ↓ Insulin release
        - Masked hypoglycaemia
    ren:
        - ↓ Renin
    gu:
    git:
    haeme:
considerations:
    - CYP2D6 poor metabolism → ↑ nebivolol + prolonged half-life
    - β1 selectivity ↓ above 10mg
    - Verapamil/diltiazem → severe bradycardia/AV block/↓ inotropy
    - Abrupt withdrawal → worsening CCF, angina or arrhythmia
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
