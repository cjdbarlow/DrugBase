---
aliases:
    - Timoptol
class: Non-selective β antagonist
chemistry: Thiadiazole morpholine derivative
dose:
    Glaucoma (eye): 1 drop of 0.25% BD; may increase to 0.5% BD
pharmaceutics:
    presentation: Clear colourless 0.25% and 0.5% eye drops
    compatibility:
    solubility: Water- and alcohol-soluble
pharmacokinetics:
    absorption: Systemically absorbed after ocular administration
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life: ~4 hours
        duration: IOP reduction up to 24 hours
        pathway: Extensive hepatic CYP2D6 metabolism
        metabolites:
    elimination:
        renal: Small amount unchanged
mechanism:
    target:
        - β1 and β2 adrenoreceptors
    action: Competitive β1/β2 antagonism → ↓ cAMP-mediated aqueous humour production
contraindications:
    - Reactive airway disease or severe COPD
    - Sinus bradycardia or sinoatrial block
    - Second- or third-degree AV block
    - Overt cardiac failure
    - Cardiogenic shock
pregnancy:
    code: C
    justification: β-blockade may cause fetal or neonatal bradycardia.
pharmacodynamics:
    resp:
        - Bronchospasm
    cvs:
        - ↓ HR
        - ↓ Inotropy and CO
        - ↓ MAP
        - Heart block
    cns:
        - Fatigue
        - Depression
        - Nightmares
    endo:
        - Masks hypoglycaemia
    msk:
    met:
    ren:
    gu:
    git:
        - Nausea
        - Diarrhoea
    haeme:
considerations:
    - ↓ IOP without miosis or cycloplegia
    - Nasolacrimal pressure → ↓ systemic absorption
    - Ocular absorption can cause systemic β-blockade
    - Verapamil → ↑ heart-block risk
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Mundipharma Pty Ltd. TIMOPTOL Australian Product Information. Revised 31 May 2022.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
