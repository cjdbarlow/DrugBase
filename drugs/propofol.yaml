---
aliases: 2,6-diisopropylphenol
class: IV anaesthetic
chemistry: Alkylphenol; phenolic derivative
dose:
    Induction: 1.5-2.5mg/kg
    Maintenance (IV): 4-12mg/kg/hr
    ICU sedation (IV): 0.3-4mg/kg/hr
    Procedural sedation (IV): 0.5-1mg/kg then 1.5-4.5mg/kg/hr
pharmaceutics:
    presentation: White oil-in-water emulsion at pH 7-8.5 and 10 or 20mg/mL; contains soya oil, MCT and egg lecithin; 1.02kcal/mL; no antimicrobial preservative
    solubility: "pKa 11; almost entirely unionised at physiological pH; minimally water soluble"
pharmacokinetics:
    absorption: Onset ~30 seconds (IV)
    distribution:
        pKa: 11
        vd: 4 L/kg
        protein binding: 98%
    metabolism:
        half-life: "t½α 2-4 minutes; rapid elimination t½ 30-60 minutes; terminal t½ 4-23 hours"
        duration: 5-10 minutes after induction dose
        pathway: Hepatic and extra-hepatic glucuronidation; clearance 21-29mL/kg/min
        metabolites: Inactive glucuronide and quinol conjugates
    elimination:
        renal: Renal elimination of inactive glucuronide and sulfate metabolites; green urine
mechanism:
    target:
        - GABAA receptor
        - Glycine receptor
        - Nicotinic ACh receptor
        - D2 receptor
    action: Binds to β-subunit of postsynaptic GABAA receptor → ↑ duration of Cl- channel opening → ↑ Cl- conductance → hyperpolarisation → ↓ neuronal depolarisation; also potentiates glycine, inhibits nicotinic ACh and D2 receptors
contraindications:
pregnancy:
    code: C
    justification: Neonatal CNS/respiratory depression; greater concern if fetus compromised
pharmacodynamics:
    resp:
        - Respiratory depression
        - Apnoea
        - Strong suppression of laryngeal reflexes
        - ↓ Response to hypoxia and hypercapnia
        - Bronchodilation
    cvs:
        - ↓ SVR (arterial and venous vasodilation via ↑ NO release)
        - ↓ VR
        - ↓ BP
        - ↓ Inotropy (via ↓ SNS tone)
        - ↓ MVO2
        - Depresses baroreceptor reflex
    cns:
        - Hypnosis; rapid loss of consciousness within one arm-brain circulation time
        - ↓ CMRO2
        - ↓ CBF
        - ↓ ICP
        - Anticonvulsant
        - ↓ IOP
        - Paradoxical excitatory effects in approximately 10% (dystonic movements of subcortical origin)
    endo:
    msk:
        - Pain on injection into small veins
    met:
        - Fat overload syndrome and lipaemia following prolonged infusion
        - Inhibits mitochondrial function
    ren:
        - Green urine
    gu:
    git:
        - Antiemetic
        - ↓ Hepatic blood flow
    haeme:
considerations:
    - "Propofol infusion syndrome (typically >48 hours and >5mg/kg/hr): lactic acidosis, arrhythmia, cardiac failure, rhabdomyolysis, hyperkalaemia, lipaemia, hepatomegaly and renal failure"
    - No antimicrobial preservative — use immediately; replace infusion system ≤12 hours
references:
