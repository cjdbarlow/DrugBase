---
aliases: OxyNorm
class: Opioid
chemistry: Semisynthetic phenanthrene opioid
dose:
    Analgesia (PO IR): 5-10mg every 4-6 hours
    Analgesia (IV): 1-5mg over 1-2 minutes; increments every 5-10 minutes
    PCA (IV): ≤0.03mg/kg; ≥5min lockout
pharmaceutics:
    presentation: 10 or 50mg/mL solution for injection/infusion
    compatibility: Compatible with 0.9% NaCl, 5% glucose and water; incompatible with alkaline solutions and prochlorperazine
    solubility: "pKa 8.5; quite hydrophilic; less than 10% unionised at physiological pH"
pharmacokinetics:
    absorption: PO bioavailability 60-80%; SC Tmax 15-30 minutes; equivalent IV and SC availability; morphine-like lipid solubility but faster onset, possibly due to active CNS uptake
    distribution:
        pKa: 8.5
        vd: 3 L/kg
        protein binding: 45%
    metabolism:
        half-life: 3-5 hours
        duration: 4 hours
        pathway: Hepatic CYP3A4 → noroxycodone (~80%); CYP2D6 → oxymorphone (~20%); metabolites make little contribution to effect
        metabolites: Noroxycodone; oxymorphone (minor contribution to effect)
    elimination:
        renal: Renal elimination of parent drug and metabolites; accumulation in renal impairment
mechanism:
    target:
        - μ-opioid receptor (MOP)
        - κ-opioid receptor (KOP)
        - δ-opioid receptor (DOP)
    action: Gi/o activation → ↓ adenylyl cyclase and cAMP; ↑ postsynaptic K+ conductance and ↓ presynaptic Ca2+ influx → hyperpolarisation and ↓ neurotransmitter release
contraindications:
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO2 → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO2
    cvs:
        - ↓ HR
        - ↓ BP due to histamine release/peripheral vasodilation
        - ↑ PVR
    cns:
        - Sedation
        - Euphoria
        - Nausea and vomiting due to CTZ stimulation
        - Miosis (stimulation of Edinger-Westphal nucleus)
        - ↓ MAC up to 90%
    endo:
    msk:
        - Muscle rigidity
        - Pruritus (especially with intrathecal administration)
    met:
        - ↓ ACTH, gonadotrophins, cortisol and testosterone; ↑ prolactin
    ren:
        - ↑ ADH
        - ↑ Ureteric and bladder sphincter tone → urinary retention
    gu:
    git:
        - ↓ Peristalsis and GIT secretions → constipation
    haeme:
considerations:
    - ↑ Oxycodone and noroxycodone in renal/hepatic impairment
    - "Equianalgesic dose (PO): 10mg = 15mg PO morphine"
    - "Equianalgesic dose (IV): 10mg = 10mg IV morphine"
references:
