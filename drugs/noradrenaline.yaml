---
aliases:
    - Norepinephrine
class: Adrenergic vasopressor
chemistry: Endogenous catecholamine
dose:
    shock: 0.05-1.5µg/kg/min IV
pharmaceutics:
    presentation: Clear colourless/yellow 1mg/mL concentrate; light-sensitive
    compatibility: Dilute in a glucose-containing solution; not saline alone
    solubility: Water-soluble
pharmacokinetics:
    absorption: No PO bioavailability due to destruction by COMT and MAO in the gut brush border
    distribution:
        pKa: 8.85
        vd: 0.12L/kg
        protein binding: 25%
    metabolism:
        half-life: 2 minutes
        duration: Very short; rapid onset
        pathway: Rapid COMT and MAO metabolism in liver, tissues and sympathetic nerves
        metabolites:
            - VMA
            - Normetadrenaline
    elimination:
        renal: Metabolites
        other: Pulmonary uptake of up to 25%
mechanism:
    target:
        - α1 adrenoreceptor
        - α2 adrenoreceptor
        - β1 adrenoreceptor
    action: α1/α2 >> β1; negligible β2 activity
contraindications:
    - Uncorrected hypovolaemia
    - Mesenteric or peripheral vascular thrombosis
pharmacodynamics:
    resp:
    cvs:
        - ↑ SVR
        - ↑ Preload
        - ↑ MAP
        - ↑ Myocardial O2 consumption
        - ↑ Coronary flow
        - Reflex ↓ HR
        - CO ↔/↓
    cns:
    endo:
    msk:
        - Necrosis with extravasation
    met:
        - Acidosis → ↓ effect
    ren:
        - ↓ RBF
    gu:
        - ↓ Uterine blood flow
        - Foetal bradycardia
    git:
        - ↓ Splanchnic blood flow
    haeme:
considerations:
    - MAOI/TCA → severe prolonged hypertension
    - Extravasation → phentolamine infiltration
    - Avoid leg veins in elderly/PVD
references:
    - Fresenius Kabi Australia Pty Limited. Noradrenaline Kabi Australian Product Information. Approved 18 December 2024.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
