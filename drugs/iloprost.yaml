---
aliases:
    - Ventavis
class: Pulmonary vasodilator
chemistry: Synthetic prostacyclin analogue (eicosanoid)
dose:
    PAH: 2.5-5µg neb 6-9 times/day
    RV failure: 20µg neb Q2h for ≤48h; then Q6h on days 3-4
pharmaceutics:
    presentation: 10µg/mL nebuliser solution; 20µg/2mL ampoule
    compatibility: Wellington Aeroneb protocol adds 3mL 0.9% NaCl; do not mix with other nebulised medicines
    solubility:
pharmacokinetics:
    absorption: Rapid pulmonary absorption; undetectable 30-60 minutes after inhalation
    distribution:
        pKa:
        vd: 0.6-0.8L/kg (IV)
        protein binding: ~60%
    metabolism:
        half-life: 5-25 minutes (inhaled)
        duration: 1-2 hours
        pathway: Extensive β-oxidation of the carboxyl side chain
        metabolites:
            - Tetranor-iloprost (inactive)
    elimination:
        renal: Metabolites; 68% urine and 12% faeces after IV dose
mechanism:
    target:
        - Prostacyclin receptor (IP receptor)
    action: IP receptor agonist → ↑ cAMP → pulmonary vasodilation and ↓ platelet aggregation
contraindications:
    - High haemorrhage risk
    - Severe CAD, unstable angina or recent MI
    - Decompensated HF or severe arrhythmia
    - Pulmonary veno-occlusive disease
    - Significant valvular disease with myocardial dysfunction
pregnancy:
    code: B3
    justification:
pharmacodynamics:
    resp:
        - Pulmonary vasodilation
        - Bronchospasm and cough
    cvs:
        - ↓ PVR
        - ↓ PAP
        - ↑ CO and SvO2
        - Minor ↓ SVR and MAP
    cns:
    endo:
    msk:
    met:
    ren:
    gu:
    git:
    haeme:
        - Inhibition of platelet aggregation
considerations:
    - Short effect → 6-9 inhalations/day
    - Pulmonary oedema → consider PVOD and stop
    - Hepatic/severe renal impairment: initially Q3-4h
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Bayer Australia Ltd. VENTAVIS Australian Product Information. Version VX1.0. Revised 3 March 2020.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
