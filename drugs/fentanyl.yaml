---
aliases: Sublimaze
class: Opioid
chemistry: Synthetic phenylpiperidine opioid
dose:
    Laryngoscopy (IV): 1-3μg/kg over 3-5 minutes
    Paediatric (IV; 2-12 years): 2-3μg/kg
pharmaceutics:
    presentation: Clear, colourless, preservative-free solution; 50μg/mL; pH 4.0-7.5
    compatibility: Compatible with 0.9% NaCl and 5% glucose; incompatible with thiopental and methohexitone
    solubility: "pKa 8.4; octanol-water partition coefficient 717; 600x more lipid soluble than morphine; 9% unionised at pH 7.4"
pharmacokinetics:
    absorption: Rapid IV onset (peak ~5 minutes); slow transdermal absorption; PO bioavailability 33%; significant first-pass pulmonary uptake
    distribution:
        pKa: 8.4
        vd: 4 L/kg
        protein binding: 85%
    metabolism:
        half-life: ~3.5 hours
        duration: Variable; with doses greater than 3 μg/kg tissues become saturated and duration is significantly prolonged
        pathway: Hepatic CYP3A4 N-dealkylation → norfentanyl (inactive); also intestinal CYP3A4 metabolism
        metabolites: Norfentanyl (inactive)
    elimination:
        renal: Renal elimination of inactive metabolites; 10% of dose excreted unchanged in urine
mechanism:
    target:
        - μ-opioid receptor (MOP)
    action: Gi/o activation → ↓ adenylyl cyclase and cAMP; ↑ postsynaptic K+ conductance and ↓ presynaptic Ca2+ influx → hyperpolarisation and ↓ neurotransmitter release
contraindications:
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO2 → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO2
    cvs:
        - Vagal bradycardia
        - Blunted cardiovascular reflexes and ↓ sympathetic response to intubation
        - ↑ PVR
    cns:
        - Sedation
        - Euphoria
        - Nausea and vomiting due to CTZ stimulation
        - Miosis (stimulation of Edinger-Westphal nucleus)
        - ↓ MAC up to 90%
    endo:
    msk:
        - Chest wall rigidity
        - Pruritus (especially with intrathecal administration)
    met:
        - ↓ ACTH, gonadotrophins, cortisol and testosterone; ↑ prolactin
    ren:
        - ↑ ADH
        - ↑ Ureteric and bladder sphincter tone → urinary retention
    gu:
    git:
        - ↓ Peristalsis and GIT secretions → constipation
    haeme:
considerations:
    - Minimal histamine release
    - Tissue saturation >3μg/kg → prolonged duration; low-dose offset reflects redistribution
    - Equianalgesic dose (IV): 100μg = 10mg IV morphine
