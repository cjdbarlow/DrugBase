---
aliases:
    - Cialis
    - Adcirca
class: Pulmonary vasodilator
chemistry: Pyrazinopyridoindole
dose:
    PAH: 40mg PO OD
    ED (PRN): 10-20mg PO PRN; max OD
    ED (regular): 2.5-5mg PO OD
pharmaceutics:
    presentation: 2.5mg, 5mg, 10mg or 20mg tablets
    compatibility:
    solubility: Practically insoluble in water; very slightly soluble in ethanol
pharmacokinetics:
    absorption: High PO bioavailability; Tmax 2-4 hours; food unaffected
    distribution:
        pKa: 3.5
        vd: ~0.9L/kg
        protein binding: 94%
    metabolism:
        half-life: 17.5 hours
        duration: Effect maximal ~2 hours post-dose
        pathway: Hepatic; CYP3A4 (>80%)
        metabolites:
            - Methylcatechol glucuronide (inactive)
    elimination:
        renal: ~36% urine; predominantly faecal (~61%)
mechanism:
    target:
        - Phosphodiesterase 5 (PDE5)
    action: Inhibits PDE5-mediated cGMP hydrolysis → ↑ cGMP → pulmonary > systemic vasodilation
contraindications:
    - Nitrates or NO donors
    - Riociguat
    - Previous NAION
    - MI <90 days or stroke <6 months
    - Unstable angina, BP <90/50mmHg or uncontrolled arrhythmia/hypertension
pregnancy:
    code: B1
    justification:
pharmacodynamics:
    resp:
    cvs:
        - ↓ PVR
        - ↓ SVR
        - ↓ BP
        - Reflex ↑ HR
        - Flushing
    cns:
        - Headache
    endo:
    msk:
        - Back pain/myalgia
    met:
    ren:
    gu:
        - Priapism
    git:
    haeme:
considerations:
    - Longer t½ than sildenafil (17.5h vs 4h) → OD dosing
    - Bosentan ↓ tadalafil AUC 42% and Cmax 27%
    - Avoid nitrates for ≥48h after last dose (4-5 days in elderly)
references:
