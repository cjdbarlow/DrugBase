---
aliases:
    - NovoRapid
class: Rapid-acting insulin analogue
chemistry: Human insulin analogue; ProB28 → Asp
dose:
    T1/T2DM (SC): 0.5-1units/kg/day total; 50-70% as prandial insulin
pharmaceutics:
    presentation: Clear colourless 100units/mL solution in 10mL vial, 3mL cartridge or pen
    compatibility: NPH insulin immediately before SC injection
    solubility: Highly soluble; reduced self-association
pharmacokinetics:
    absorption: SC onset 10-20 minutes; peak 1-3 hours
    distribution:
        pKa:
        vd: 0.44L/kg
        protein binding: 0-9%
    metabolism:
        half-life: 81 minutes after SC injection
        duration: 3-5 hours
        pathway: Hepatic, renal and peripheral proteolysis; receptor-mediated endocytosis
        metabolites:
            - Inactive peptides
    elimination:
        renal: ~1% unchanged
mechanism:
    target:
        - Insulin receptor tyrosine kinase
    action: Receptor autophosphorylation → IRS/PI3K/Akt signalling → GLUT4 translocation and altered enzyme activity
contraindications:
    - Hypoglycaemia
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
    cvs:
        - Positive inotropy
    cns:
        - Severe hypoglycaemia → seizures or coma
    endo:
        - ↓ BGL
        - ↓ Glucagon release
        - Hypoglycaemia
    msk:
        - ↑ Glucose and amino-acid uptake
        - ↑ Glycogen and protein synthesis
    met:
        - ↓ K+
        - ↓ Lipolysis and proteolysis
        - ↑ Lipogenesis
    ren:
    gu:
    git:
    haeme:
considerations:
    - Give immediately before or soon after starting a meal
    - IV use requires medical supervision; no advantage over soluble human insulin IV
    - Rotate injection sites
    - Renal or hepatic impairment → adjust dose
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Novo Nordisk Pharmaceuticals Pty Limited. NovoRapid Australian Product Information. Revised 20 December 2021.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
