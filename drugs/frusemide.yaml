---
aliases:
    - Furosemide
    - Lasix
class: Loop diuretic
chemistry: Anthranilic acid derivative
dose:
    Oedema: 20-80mg PO; repeat or increase by 20-40mg after ≥6h; max 400mg/day (except advanced renal failure)
    Oedema IV: 20-40mg slow IV; repeat or increase by 20mg after ≥2h
    Pulmonary oedema: 40mg slow IV; may increase to 80mg after 1h
pharmaceutics:
    presentation: 10mg/mL oral solution; 10mg/mL solution for injection
    compatibility: Compatible with 0.9% NaCl and Hartmann's; alkaline solution
    solubility: Practically insoluble in water; freely soluble in dilute alkali
pharmacokinetics:
    absorption: 10-100% PO bioavailability; mainly gastric
    distribution:
        pKa: 3.6
        vd: 0.1-0.2L/kg
        protein binding: 95%
    metabolism:
        half-life: 30-120min
        duration: ~6h PO; ~2h IV
        pathway: ~35% glucuronidation, predominantly renal
        metabolites:
            - Active glucuronide; ~25% parent activity
    elimination:
        renal: ~65% unchanged by filtration and proximal tubular secretion
mechanism:
    target:
        - NKCC2 chloride-binding site
    action: NKCC2 inhibition in the thick ascending limb → ↓ medullary gradient and ↑ Na+, K+, Cl− and water excretion
contraindications:
    - Anuria or complete renal shutdown
    - Severe hypokalaemia or hyponatraemia
    - Hypovolaemia, dehydration or hypotension
    - Hepatic coma or precoma
    - Pregnancy or breastfeeding
pregnancy:
    code: C
    justification: May cause fetal electrolyte disturbance and neonatal thrombocytopenia
pharmacodynamics:
    resp:
        - ↓ Pulmonary oedema
    cvs:
        - ↓ Preload, circulating volume and MAP
    cns:
        - Tinnitus and deafness, especially with rapid or high-dose IV use
    endo:
    msk:
        - Cramps and weakness with electrolyte depletion
    met:
        - Hypokalaemic hypochloraemic alkalosis, hyponatraemia and hypomagnesaemia
        - Hyperuricaemia and hyperglycaemia
    ren:
        - May ↑ RBF if volume maintained; GFR usually unchanged; potent diuresis
    gu:
    git:
        - Nausea, vomiting and pancreatitis
    haeme:
        - Thrombocytopenia and other blood dyscrasias
considerations:
    - IV ≤4mg/min; ≤2.5mg/min if creatinine >5mg/dL; rapid injection ↑ ototoxicity
    - Aminoglycosides ↑ ototoxicity; NSAIDs ↓ natriuresis; diuretics ↑ lithium toxicity
    - Hypoalbuminaemia ↑ Vd and ↓ tubular delivery
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - sanofi-aventis australia pty ltd. LASIX Australian Product Information. Revised 2 June 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
