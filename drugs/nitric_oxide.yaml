---
aliases:
    - NO
    - iNO
class: Pulmonary vasodilator
chemistry: Free-radical inorganic gas (NO)
dose:
    PPHN: 20ppm inhaled; ↓ to 5ppm within 4-24h; max 20ppm
    cardiac surgery: 10-20ppm inhaled; ↓ to 5ppm
    ARDS/RVF/PHTN: 1-40ppm inhaled
pharmaceutics:
    presentation: Aluminium cylinders; 800 or 4,880ppm NO in N2 (INOmax); 100ppm also described in QMD/textbook
    compatibility: O2 → NO2; monitor NO2 <0.5ppm
    solubility: Water → HNO3 (pKa -1.3)
pharmacokinetics:
    absorption: Rapid pulmonary and systemic absorption after inhalation
    distribution:
        pKa: -1.3 (HNO3)
        vd: Unmeasurable
        protein binding: Avid haemoglobin binding
    metabolism:
        half-life: <5 seconds
        duration: Seconds
        pathway: OxyHb → methaemoglobin + nitrate; lung water → nitrite → methaemoglobin; deoxyHb → nitrosyl-Hb
        metabolites:
            - Methaemoglobin
            - Nitrite
            - Nitrate
    elimination:
        renal: Nitrate >70% excreted in urine; metHb metabolised back to Hb within hours by endogenous reductases
mechanism:
    target:
        - Soluble guanylate cyclase (sGC)
    action: Activates sGC → ↑ cGMP → ↓ intracellular Ca2+ → vasodilation; inhalation targets ventilated alveoli and Hb limits systemic effect
contraindications:
    - Concurrent PDE5 inhibitors (synergistic cGMP elevation → severe hypotension)
    - Pulmonary veno-occlusive disease (may precipitate pulmonary oedema)
    - Methaemoglobinaemia
pregnancy:
    code: B2
    justification:
pharmacodynamics:
    resp:
        - Inhibits HPV in ventilated alveoli → ↑ perfusion to ventilated units → ↑ V/Q matching
        - No effect on unventilated (shunt) units
    cvs:
        - ↓ PVR
        - ↓ PAP
        - ↑ Capillary permeability
        - Minimal systemic effect (inactivated by Hb before reaching systemic circulation)
    cns:
        - ↑ CBF (cerebral vasodilation)
    endo:
    msk:
    met:
    ren:
    gu:
    git:
    haeme:
        - Methaemoglobinaemia; neonatal MetHb >2.5% → ↓ dose
        - Inhibition of platelet aggregation
        - Thrombocytopenia (~10% of patients)
considerations:
    - Abrupt cessation → rebound PHTN/hypoxaemia; wean stepwise
    - Monitor inspired NO/NO2, FiO2 and MetHb
    - Sildenafil/other cGMP vasodilators → additive effect; caution
    - Pulmonary oedema → consider PVOD/LV dysfunction
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
