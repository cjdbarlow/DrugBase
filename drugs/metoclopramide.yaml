---
aliases:
    - Maxolon
    - Metamide
class: Benzamide dopamine antagonist
chemistry: Substituted benzamide; pKa 9.27
dose:
    Nausea (PO): 10mg Q6-8H
    Nausea (IV/IM): 10-20mg TDS; max 0.5mg/kg/day or 30mg/day for 5 days
pharmaceutics:
    presentation: 10mg tablet; clear colourless 5mg/mL solution
    compatibility: Compatible with 0.9% NaCl, 5% glucose and Hartmann's
    solubility: Highly water-soluble
pharmacokinetics:
    absorption: Oral bioavailability ~80%; IV onset 1-3 minutes; IM onset 10-15 minutes
    distribution:
        pKa: 9.27
        vd: 3.5L/kg
        protein binding: 13-22%
    metabolism:
        half-life: 4-6 hours
        duration: 1-2 hours
        pathway: Hepatic CYP2D6 and glucuronide/sulphate conjugation
        metabolites:
            - Glucuronide and sulphate conjugates
    elimination:
        renal: 20-50% unchanged; conjugates in urine
mechanism:
    target:
        - Central and peripheral D2 receptors
        - Peripheral muscarinic receptors
    action: D2 antagonism → antiemesis; muscarinic agonism → ↑ upper-GI motility
contraindications:
    - GI haemorrhage, obstruction or perforation
    - Phaeochromocytoma
    - Porphyria
    - Epilepsy
    - Drugs causing extrapyramidal reactions
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - Acute dystonia → upper-airway obstruction
    cvs:
        - ↑/↓ HR
        - ↑/↓ BP
    cns:
        - Acute dystonia
        - Akathisia
        - Tardive dyskinesia
        - Neuroleptic malignant syndrome
        - Sedation
    endo:
        - ↑ Prolactin → galactorrhoea
    msk:
    met:
    ren:
    gu:
    git:
        - Antiemetic
        - ↑ Gastric emptying
        - ↑ Lower oesophageal sphincter tone
    haeme:
        - Methaemoglobinaemia
considerations:
    - Young patients and higher doses → ↑ extrapyramidal side effects
    - Renal impairment → ↓ clearance and t1/2 up to 15 hours
    - Antimuscarinics and opioids antagonise prokinetic effect
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Baxter Healthcare Pty Ltd. Metoclopramide-Baxter Australian Product Information. Revised 25 September 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
