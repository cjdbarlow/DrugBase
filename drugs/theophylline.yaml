---
aliases:
    - Nuelin
class: Methylxanthine bronchodilator
chemistry: 1,3-Dimethylxanthine
dose:
    Maintenance (SR): 200-300mg PO Q12H
pharmaceutics:
    presentation: SR tablets 200mg, 250mg or 300mg; syrup 26.67mg/5mL
    compatibility: SR tablets may be halved; do not chew or crush
    solubility:
pharmacokinetics:
    absorption: ~100% PO bioavailability (SR); peak 4-6h
    distribution:
        pKa:
        vd: 0.5L/kg
        protein binding: 50-70% (adults); ~40% in neonates/cirrhosis
    metabolism:
        half-life: 3-12h (healthy adults)
        duration:
        pathway: Hepatic metabolism, mainly CYP1A2; low extraction ratio
        metabolites:
            - 1,3-Dimethyluric acid
            - 3-Methylxanthine (active)
            - Caffeine (active; preterm neonates)
            - 1-Methyluric acid
    elimination:
        renal: Metabolites; ~10% unchanged
mechanism:
    target:
        - Phosphodiesterase
        - Adenosine receptors
    action: 'Proposed non-selective PDE inhibition → ↓ cAMP hydrolysis → bronchial smooth-muscle relaxation; adenosine-receptor antagonism'
contraindications:
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - Bronchodilation; ↑ diaphragmatic contractility
    cvs:
        - ↑ Inotropy and chronotropy; tachyarrhythmias
    cns:
        - CNS stimulation; insomnia, tremor and seizures
    endo:
    msk:
    met:
        - Hypokalaemia
    ren:
        - Diuresis and natriuresis
    gu:
    git:
        - ↑ Gastric secretion; nausea and vomiting
    haeme:
considerations:
    - Narrow therapeutic index; target 10-20microg/mL
    - SR preparations are unsuitable for acute asthma
    - Smoking ↑ clearance; hepatic dysfunction, heart failure, hypoxia and acute illness ↓ clearance
    - Numerous CYP interactions; avoid concurrent xanthines
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - iNova Pharmaceuticals (Australia) Pty Limited. NUELIN-SR and NUELIN Australian Product Information. Revised 8 January 2019.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Petkov V. Essential Pharmacology for the ANZCA Primary Examination. 2012.
