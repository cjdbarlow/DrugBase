---
aliases:
    - Solu-Medrol
class: Intermediate-acting glucocorticoid
chemistry: Synthetic corticosteroid; sodium succinate ester for injection
dose:
    ARDS: 1-2mg/kg/day IV
    Life-threatening inflammation: 30mg/kg IV adjunct over ≥30min; repeat Q4-6H for ≤48h
pharmaceutics:
    presentation: 40mg, 125mg, 500mg, 1g and 2g powder for IV/IM injection
    compatibility: Dilute in 0.9% NaCl or 5% glucose; do not mix directly with other drugs
    solubility: Lipid soluble; water-soluble sodium succinate ester
pharmacokinetics:
    absorption: 80% PO bioavailability
    distribution:
        pKa: 12.61
        vd: 1.38L/kg
        protein binding: 77%
    metabolism:
        half-life: 2-3h
        duration: Biological activity 12-36h
        pathway: Extensive hepatic metabolism
        metabolites:
            - 20α-hydroxymethylprednisolone
            - 20β-hydroxymethylprednisolone
    elimination:
        renal: Inactive conjugates; ~1% unchanged
mechanism:
    target:
        - Glucocorticoid receptor
    action: Receptor binding → genomic and non-genomic regulation of inflammatory, immune and metabolic pathways
contraindications:
    - Systemic fungal infection
    - Cow's milk/dairy hypersensitivity (40mg ACT-O-VIAL)
    - Intrathecal, epidural or local injection
    - Live vaccines with immunosuppressive dosing
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - ↓ Airway and alveolar inflammation; ↑ response to catecholamines
    cvs:
        - ↑ Inotropy and vascular response to catecholamines
    cns:
        - Insomnia, mood disturbance and psychosis
    endo:
        - HPA-axis suppression and Cushingoid state
    msk:
        - Proximal myopathy, osteoporosis and skin thinning
    met:
        - ↑ Gluconeogenesis, protein catabolism and lipolysis
        - Hyperglycaemia; weak mineralocorticoid effect
    ren:
        - Na+ and water retention; K+ loss
    gu:
    git:
        - Peptic ulceration and pancreatitis
    haeme:
        - Neutrophilia, lymphopenia and impaired immune function
considerations:
    - 'ARDS: start within 2wk; later initiation may ↑ mortality'
    - 4mg methylprednisolone ≈5mg prednisolone ≈20mg hydrocortisone
    - Doses >250mg over ≥30min; rapid high-dose IV use may cause arrhythmia or cardiac arrest
    - Infection risk; taper after prolonged therapy to avoid adrenal crisis
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
