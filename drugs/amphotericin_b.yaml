---
aliases:
    - AmBisome
class: Polyene antifungal
chemistry: Amphoteric heptaene macrolide; liposomal formulation
dose:
    Systemic mycosis (IV): 3-5mg/kg daily
    Mucormycosis (IV): 5-10mg/kg daily
pharmaceutics:
    presentation: 50mg liposomal powder for IV infusion
    compatibility: Reconstitute with water, then dilute only in glucose 5%; saline and other drugs → precipitation
    solubility: Poorly water-soluble; incorporated into liposomes
pharmacokinetics:
    absorption: Negligible PO
    distribution:
        pKa:
        vd: 18.9-49.1L
        protein binding:
    metabolism:
        half-life: 26-38.2 hours
        duration:
        pathway: Not established
        metabolites:
    elimination:
        renal: Negligible urinary excretion
mechanism:
    target:
        - Ergosterol in fungal cell membranes
    action: Forms membrane pores → leakage of intracellular contents and cell death
contraindications:
pregnancy:
    code: B3
    justification:
pharmacodynamics:
    resp:
        - Infusion reaction → dyspnoea, hypoxia
    cvs:
        - Infusion reaction → ↓ or ↑ MAP, ↑ HR
    cns:
        - Headache
    endo:
    msk:
        - Infusion reaction → back, chest or abdominal pain; rigors
    met:
        - ↓ K+
        - ↓ Mg2+
        - Renal tubular acidosis
    ren:
        - AKI
    gu:
    git:
        - Nausea; vomiting
        - ↑ LFTs; cholestasis
    haeme:
        - Normocytic anaemia
considerations:
    - Broad-spectrum and fungicidal; resistance is uncommon
    - Liposomal formulation ↓ nephrotoxicity versus conventional amphotericin B
    - Poor CSF penetration
    - Infuse over 30-60 minutes; doses >5mg/kg over 2 hours
    - Monitor renal function, K+, Mg2+, LFTs and FBC
    - Other nephrotoxins ↑ nephrotoxicity
    - Corticosteroids ↑ hypokalaemia; hypokalaemia ↑ digoxin toxicity
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Gilead Sciences Pty Ltd. AmBisome Australian Product Information. Revised 26 February 2026.
