---
aliases:
    - ADH
    - Argipressin
    - Arginine vasopressin
class: Non-adrenergic vasopressor
chemistry: Cyclic nonapeptide
dose:
    shock: 0.01-0.08 units/min IV
pharmaceutics:
    presentation: 20 units/mL solution
    compatibility: NS or D5W
    solubility: Water-soluble
pharmacokinetics:
    absorption: No PO bioavailability; destroyed by intestinal peptidases
    distribution:
        pKa: 10.26
        vd: 0.14-0.2L/kg
        protein binding: 30%
    metabolism:
        half-life: 17-35 minutes
        duration: Peak pressor effect ~15 minutes; offset ~20 minutes
        pathway: 35% metabolised by endothelial peptidases in the liver
        metabolites:
            - Inactive peptide fragments
    elimination:
        renal: 65% excreted unchanged
mechanism:
    target:
        - V1 receptor (Gq-coupled)
        - V2 receptor (Gs-coupled)
    action: V1 → ↑ IP3/Ca2+ → vasoconstriction. V2 → ↑ cAMP → aquaporin-2 insertion → ↑ water reabsorption. Vasopressor affinity persists at low pH.
contraindications:
    - Chronic nephritis with nitrogen retention
pregnancy:
    code: B2
    justification:
pharmacodynamics:
    resp:
    cvs:
        - ↑ SVR and PVR
        - ↑ MAP
        - Reflex ↓ HR
        - ↓ CO
        - Coronary vasoconstriction at high doses
    cns:
    endo:
        - ↑ ACTH (V3)
    msk:
    met:
    ren:
        - ↑ Water reabsorption (V2)
    gu:
        - ↑ Uterine contractility (V1)
    git:
        - ↓ Mesenteric blood flow
        - ↓ Portal pressure
    haeme:
        - ↑ Platelet aggregation (V1)
        - ↑ Factor VIII and vWF (V2)
considerations:
    - Noradrenaline-sparing
    - Coronary, mesenteric, skin and digital ischaemia
    - Hyponatraemia/water intoxication
    - DI after cessation
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
