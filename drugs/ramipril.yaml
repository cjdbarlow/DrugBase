---
aliases: Ramipril Sandoz
class: ACE inhibitor
chemistry: L-proline derivative; dicarboxylate (-COOH)
dose:
    HTN (PO): 2.5mg OD; max 10mg/day
    Post-MI HF (PO): 2.5mg BD; max 5mg BD
    Proteinuria (PO): 1.25mg OD; max 5mg/day
    CV risk (PO): 2.5mg OD → 5mg after 1 week → 10mg after 3 weeks
pharmaceutics:
    presentation: 1.25mg, 2.5mg, 5mg or 10mg tablet
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 28% oral bioavailability; effect maximal ~1-2 hours; food slows absorption
    distribution:
        pKa: 3.7
        vd: 0.1L/kg
        protein binding: Ramipril 73%; ramiprilat 56%
    metabolism:
        half-life: Ramiprilat 13-17 hours
        duration: 24 hours
        pathway: Mainly hepatic; prodrug → ramiprilat
        metabolites:
            - Ramiprilat (active)
            - Glucuronides and diketopiperazine metabolites (inactive)
    elimination:
        renal: ~2% excreted unchanged; 60% parent/metabolites in urine
mechanism:
    target:
        - Angiotensin-converting enzyme (ACE)
    action: ACE zinc-site inhibition → ↓ Ang II and aldosterone; ↑ bradykinin
contraindications:
    - Pregnancy
    - Previous ACE inhibitor-associated, hereditary or idiopathic angioedema
    - Haemodynamically significant renal artery stenosis
    - Sacubitril/valsartan
    - Aliskiren in diabetes or CrCl <60mL/min
pharmacodynamics:
    resp:
        - Dry cough
    cvs:
        - ↓ SVR
        - ↓ MAP
        - No reflex ↑ HR
        - ↓ Vascular and myocardial remodelling
    cns:
    endo:
        - Hypoglycaemia (diabetes)
    msk:
    met:
        - ↑ Renin
        - ↑ K+
    ren:
        - ↑ Natriuresis if renal perfusion maintained
        - ↓ GFR/AKI if Ang II-dependent (e.g. renal artery stenosis)
    gu:
    git:
    haeme:
        - Agranulocytosis
        - Thrombocytopenia
considerations:
    - Angioedema (bradykinin-mediated)
    - K+-sparing diuretics/K+ → hyperkalaemia
    - NSAIDs → ↓ effect and AKI
    - ↓ Antihypertensive effect in Black patients
references:
    - Sandoz Pty Ltd. Ramipril Sandoz Australian Product Information. Version 1.0. Revised 27 November 2024.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
