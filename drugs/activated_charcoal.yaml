---
aliases:
    - Carbosorb X
class: Gastrointestinal adsorbent
chemistry: Activated carbon with a high internal surface area
dose:
    Single dose: 1g/kg PO/NG once; maximum 50g
    Multiple dose (adult): 1g/kg PO/NG once, then 25g Q2H
pharmaceutics:
    presentation: 50g activated charcoal in 250mL aqueous suspension
    compatibility: Adsorbs enteral medicines and antidotes
    solubility:
pharmacokinetics:
    absorption: Not absorbed from the GIT
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life:
        duration:
        pathway:
        metabolites:
    elimination:
        renal:
mechanism:
    target:
        - Unabsorbed drugs and toxins in the GIT
    action: Physical surface adsorption → ↓ toxin absorption; repeated doses interrupt enterohepatic recirculation and enhance enteral elimination
contraindications:
    - Unprotected airway
    - Bowel obstruction, perforation or non-intact GIT
    - Corrosives, hydrocarbons, alcohols, lithium, iron and other poorly adsorbed toxins
pregnancy:
    code:
    justification:
pharmacodynamics:
    resp:
