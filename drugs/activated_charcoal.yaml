    gu:
    git:
        - Vomiting, constipation, bezoar, obstruction and perforation
        - Black stools
    haeme:
considerations:
    - Greatest benefit within 1h of ingestion
    - Multiple doses for life-threatening carbamazepine, dapsone, phenobarbitone, quinine or theophylline poisoning
    - Check bowel sounds before each repeat dose; stop if absent
    - Give concurrent medicines parenterally where possible
    - Monitor fluids/electrolytes with repeated doses, especially children
