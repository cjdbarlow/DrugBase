---
aliases: Ultiva
class: Opioid
chemistry: Synthetic phenylpiperidine opioid
dose:
    Induction (IV): 0.5-1μg/kg/min with or without 1μg/kg over 60 seconds
    Infusion (IV): 0.05-2μg/kg/min
    ICU (IV): 0.1-0.15μg/kg/min; increase by 0.025μg/kg/min; no bolus
    TCI (Minto): 3-8ng/mL; up to 15ng/mL for highly stimulating surgery
    TCI >65 years (Minto): 1.5-4ng/mL
pharmaceutics:
    presentation: White lyophilised powder containing glycine; 1, 2 or 5mg; clear and colourless after reconstitution
    solubility: "pKa 7.3; octanol-water partition coefficient 17.9; 20x more lipid soluble than morphine; 58% unionised at pH 7.4"
pharmacokinetics:
    absorption: IV; peak effect 1-3 minutes
    distribution:
        pKa: 7.3
        vd: Central 0.1 L/kg; steady-state 0.35 L/kg
        protein binding: 70%
    metabolism:
        half-life: Effective 3-10 minutes; terminal 10-20 minutes
        duration: Offset 5-10 minutes from ceasing infusion; independent of infusion duration or dose
        pathway: Rapid hydrolysis by non-specific blood and tissue esterases; independent of renal or hepatic function
        metabolites: GR90291 (4,600x less potent; renally cleared)
    elimination:
        renal: 95% urine as GR90291; parent clearance independent of renal function
mechanism:
    target:
        - μ-opioid receptor (MOP)
    action: Gi/o activation → ↓ adenylyl cyclase and cAMP; ↑ postsynaptic K+ conductance and ↓ presynaptic Ca2+ influx → hyperpolarisation and ↓ neurotransmitter release
contraindications:
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO2 → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO2
    cvs:
        - Vagal bradycardia
        - ↓ MAP (~20%)
        - ↑ PVR
    cns:
        - Sedation
        - Euphoria
        - Nausea and vomiting due to CTZ stimulation
        - Miosis (stimulation of Edinger-Westphal nucleus)
        - ↓ MAC up to 90%
    endo:
    msk:
        - Chest wall rigidity
        - Pruritus
    met:
        - ↓ ACTH, gonadotrophins, cortisol and testosterone; ↑ prolactin
    ren:
        - ↑ ADH
        - ↑ Ureteric and bladder sphincter tone → urinary retention
    gu:
    git:
        - ↓ Gastrointestinal motility
    haeme:
considerations:
    - Contains glycine — must not be administered intrathecally or epidurally
    - Constant context-sensitive half-time → predictable 5-10 minute offset independent of infusion duration
    - Establish longer-acting analgesia before cessation
    - GR90291 accumulates in renal impairment without clinically significant μ-opioid effect
    - Minto TCI model uses age and lean body mass; may underestimate lean body mass if BMI >35kg/m² (female) or >40kg/m² (male)
    - "Equianalgesic dose (IV): 50μg = 10mg IV morphine"
references:
    - Demogen Australia Pty Ltd. Remifentanil Demogen Australian Product Information. Version 1.4. First approved 20 May 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
