---
aliases:
    - Tracleer
class: Pulmonary vasodilator
chemistry: Pyrimidine derivative
dose:
    PAH: 62.5mg PO BD ×4 weeks; then 125mg BD
pharmaceutics:
    presentation: 62.5mg or 125mg film-coated tablets
    compatibility:
    solubility: pH-dependent; practically insoluble at low pH
pharmacokinetics:
    absorption: 50% PO bioavailability; Tmax ~3.7 hours; food does not alter extent
    distribution:
        pKa: 5.8
        vd: 28L/kg
        protein binding: 98%
    metabolism:
        half-life: ~5 hours
        duration: Effect maximal ~1 hour post-dose
        pathway: Hepatic; CYP2C9 and CYP3A4; auto-induces its own metabolism
        metabolites:
            - Ro 48-5033 (active; contributes ~10-20% of total effect)
    elimination:
        renal: Biliary; 94% faeces (30% unchanged); <3% urine
mechanism:
    target:
        - Endothelin-A receptor (ETA)
        - Endothelin-B receptor (ETB)
    action: Competitive ETA/ETB antagonist → ↓ ET-1-mediated vasoconstriction and proliferation; ETB blockade also ↓ NO/PGI2 release and ET-1 clearance
contraindications:
    - Pregnancy
    - Child-Pugh B/C or baseline AST/ALT >3× ULN
    - Concurrent ciclosporin
    - Concurrent glibenclamide
pregnancy:
    code: X
    justification: Class teratogenicity → multiple fetal abnormalities/major birth defects
pharmacodynamics:
    resp:
        - ↓ PVR
        - ↓ PAP
        - ↓ Pulmonary vascular remodelling
    cvs:
        - ↓ SVR
        - ↓ BP
    cns:
        - Headache
    endo:
    msk:
    met:
        - ↑ LFTs
    ren:
        - Fluid retention
    gu:
    git:
    haeme:
        - Anaemia
considerations:
    - LFTs baseline and monthly
    - Hb at 1 and 3 months, then Q3-monthly
    - PVOD → pulmonary oedema
    - Auto-induces CYP2C9/3A4; ↓ hormonal contraceptive efficacy
    - Teratogenic; monthly pregnancy tests; contraception for 3 months after cessation
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Janssen-Cilag Pty Ltd. TRACLEER Australian Product Information. Version 3.0. Revised 3 February 2026.
    - Actelion Pharmaceuticals US, Inc. TRACLEER United States Prescribing Information. Revised November 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
