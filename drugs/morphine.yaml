---
aliases:
class: Opioid
chemistry: Natural phenanthrene opioid
dose:
    Bolus (IV): 0.1-0.2mg/kg every 4 hours PRN; administer slowly
    Infusion (IV): 0.02-0.04mg/kg/hr
pharmaceutics:
    presentation: Clear, slightly yellow to yellow, preservative-free solution; 5, 10, 15 or 30mg/mL; pH 3.2-4.0
    compatibility: Compatible with 0.9% NaCl, 5% glucose and Hartmann's; incompatible with alkaline solutions, aminophylline, barbiturates and phenytoin
    solubility: "pKa 8.0; octanol-water partition coefficient ~1.42; 23% unionised at pH 7.4"
pharmacokinetics:
    absorption: PO bioavailability 30%; low lipid solubility → slower onset and SC absorption
    distribution:
        pKa: 8.0
        vd: 3.5 L/kg
        protein binding: 35%
    metabolism:
        half-life: 1.5-2 hours
        duration: 3-4 hours
        pathway: Hepatic glucuronidation to morphine-3-glucuronide (~70%; neuroexcitatory) and morphine-6-glucuronide (~10%; active)
        metabolites: Morphine-3-glucuronide (neuroexcitatory); morphine-6-glucuronide (active)
    elimination:
        renal: Renal elimination of glucuronides; accumulation in renal impairment
mechanism:
    target:
        - μ-opioid receptor (MOP)
        - κ-opioid receptor (KOP)
    action: Gi/o activation → ↓ adenylyl cyclase and cAMP; ↑ postsynaptic K+ conductance and ↓ presynaptic Ca2+ influx → hyperpolarisation and ↓ neurotransmitter release
contraindications:
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO2 → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO2
    cvs:
        - ↓ HR
        - ↓ BP due to non-immune histamine release → vasodilation
        - ↑ PVR
    cns:
        - Sedation
        - Euphoria
        - Nausea and vomiting due to CTZ stimulation
        - Miosis (stimulation of Edinger-Westphal nucleus)
        - ↓ MAC up to 90%
    endo:
    msk:
        - Muscle rigidity
        - Pruritus (especially with intrathecal administration)
    met:
        - ↓ ACTH, gonadotrophins, cortisol and testosterone; ↑ prolactin
    ren:
        - ↑ ADH
        - ↑ Ureteric and bladder sphincter tone → urinary retention
    gu:
    git:
        - ↓ Peristalsis and GIT secretions → constipation
    haeme:
considerations:
    - ↑ Free drug in renal failure as uraemia displaces morphine from binding sites
    - Morphine-3-glucuronide and morphine-6-glucuronide accumulate in renal impairment → neuroexcitation and prolonged opioid effect
    - "Equianalgesic dose (IV reference): 10mg"
