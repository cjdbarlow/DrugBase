---
aliases: Norvasc
class: Dihydropyridine calcium channel blocker
chemistry: 1,4-dihydropyridine
dose:
    HTN/angina (PO): 2.5-10mg OD
pharmaceutics:
    presentation: 5mg or 10mg tablet
    compatibility:
    solubility: Excellent lipid solubility
pharmacokinetics:
    absorption: 64% oral bioavailability; Tmax 6-12 hours
    distribution:
        pKa: 8.6
        vd: 21.4L/kg
        protein binding: 95.5%
    metabolism:
        half-life: 30-50 hours
        duration: ≥24 hours
        pathway: Hepatic; CYP3A4
        metabolites:
            - Inactive metabolites
    elimination:
        renal: 10% unchanged; 60% as metabolites
mechanism:
    target:
        - Vascular L-type Ca2+ channel
    action: ↓ Ca2+ influx → arterial and coronary vasodilation
contraindications:
pharmacodynamics:
    resp:
    cvs:
        - ↓ SVR
        - ↓ MAP
        - ↓ Afterload
        - Minimal ↑ HR
        - Coronary vasodilation
    cns:
        - Headache
    endo:
    msk:
        - Peripheral oedema
        - Flushing
    met:
    ren:
    gu:
    git:
        - Constipation
    haeme:
considerations:
    - Severe aortic stenosis (afterload reduction may be detrimental)
    - Angina may worsen after initiation or dose increase
references:
    - Aspen Pharmacare Australia Pty Ltd. Norvasc Australian Product Information. Revised 26 August 2024.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
