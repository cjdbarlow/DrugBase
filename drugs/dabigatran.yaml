---
aliases:
class: Direct thrombin inhibitor
chemistry: Small molecule polypeptide
dose:
    VTE prophylaxis: 220mg PO daily
    Atrial fibrillation: 150mg PO BD
pharmaceutics:
    presentation:
        - 75mg capsules
        - 110mg capsules
    compatibility:
    solubility: Poor water solubility
pharmacokinetics:
    absorption: 6.5% oral bioavailability; etexilate rapidly/completely converted to dabigatran; Tmax 90-180 minutes
    distribution:
        pKa: 4.0
        vd: 1.0 L/kg
        protein binding: 35%
    metabolism:
        half-life: 12-14 hours
        duration:
        pathway: Prodrug activated by plasma and hepatic esterases; approximately 20% conjugated with glucuronic acid to form acylglucuronides (pharmacologically active, similar properties to unconjugated dabigatran)
        metabolites: Acylglucuronides (active)
    elimination:
        renal: 80% renal excretion of unchanged drug; 20% biliary excretion of acylglucuronides
mechanism:
    target:
        - Thrombin
    action: Reversible competitive inhibitor of thrombin (including fibrin-bound thrombin); prevents cleavage of fibrinogen to fibrin and inhibits other thrombin-driven haemostasis
contraindications:
pregnancy:
    code: C
    justification: Placental haemorrhage → prematurity/fetal loss
pharmacodynamics:
    resp:
    cvs:
        - Peripheral oedema
    cns:
        - Insomnia
    endo:
    msk:
    met:
        - Fever
    ren:
    gu:
    git:
    haeme:
        - Haemorrhage
considerations:
    - Dialysable
    - Reversible with idarucizumab
    - Significant interactions with amiodarone, quinidine, St John's Wort, and other anticoagulant and antiplatelet agents
    - Allergy reported
references:
    - Boehringer Ingelheim Pty Limited. PRADAXA Australian Product Information. Revised 5 May 2023.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
