---
aliases:
class: Beta blocker
chemistry: Aryloxypropanolamine
dose:
    hypertension/angina: 50-100mg PO daily
    arrhythmia: 2.5mg IV boluses up to 10mg
pharmaceutics:
    presentation:
        - 25mg, 50mg, 100mg tablets
        - Syrup
        - Colourless solution
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 45-55% oral bioavailability
    distribution:
        pKa: 9.6
        vd: 0.3-0.6 L/kg
