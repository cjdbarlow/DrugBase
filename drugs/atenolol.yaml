    metabolism:
        half-life: 6-9 hours
        duration:
        pathway: Not hepatically cleared
        metabolites:
    elimination:
        renal: Excreted unchanged in urine
mechanism:
    target:
        - β1 adrenoreceptor
    action: Competitive selective β1 antagonist → blocks β1 receptor-mediated cAMP synthesis.
contraindications:
pharmacodynamics:
    resp:
    cvs:
        - ↓ HR
        - ↓ Inotropy
        - ↓ MVO2
        - ↓ BP
