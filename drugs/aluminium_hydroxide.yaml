---
aliases:
    - Gastrogel
class: Antacid
chemistry: Trivalent-cation alkali
dose:
    Dyspepsia (PO): 640mg 5-6 times daily after meals and nocte; max 3.84g/day
pharmaceutics:
    presentation: 320mg/5mL oral suspension
    compatibility:
    solubility: Essentially water-insoluble; pKa 15.7
pharmacokinetics:
    absorption: Minimal; up to 0.2% with citrate
    distribution:
        pKa: 15.7
        vd:
        protein binding:
    metabolism:
        half-life:
        duration: 1-3 hours
        pathway: None
        metabolites:
    elimination:
        renal: Absorbed aluminium renally eliminated; unabsorbed salts in faeces
mechanism:
    target:
        - Gastric hydrochloric acid
    action: Al(OH)3 + 3HCl → AlCl3 + 3H2O
contraindications:
pregnancy:
    code:
    justification:
pharmacodynamics:
    resp:
        - Particulate aspiration → pneumonitis
    cvs:
    cns:
        - Accumulation → encephalopathy
    endo:
    msk:
        - Accumulation → osteomalacia and proximal myopathy
    met:
        - Hypophosphataemia
        - Systemic alkalosis
    ren:
        - Aluminium accumulation in renal impairment
    gu:
    git:
        - ↑ Gastric pH
        - Constipation
    haeme:
considerations:
    - Separate interacting oral drugs by ≥2 hours
    - Renal impairment → aluminium toxicity
    - Citrate ↑ aluminium absorption
    - Shake suspension
references:
    - Rugby Laboratories. Aluminum Hydroxide oral suspension official US label. Updated 11 December 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
    - Petkov V. Essential Pharmacology For The ANZCA Primary Examination. Vesselin Petkov. 2012.
