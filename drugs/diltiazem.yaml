---
aliases: Cardizem; Dilzem
class: Non-dihydropyridine calcium channel blocker
chemistry: Benzothiazepine
dose:
    Rate control (IV): 0.25mg/kg over 2 minutes; repeat 0.35mg/kg after 15 minutes; infusion 5-15mg/hr
    HTN/angina (PO): 30-120mg TDS; max 360mg/day
    Rate control (SR): 120-360mg OD
pharmaceutics:
    presentation: 5mg/mL injection; 30mg, 60mg, 120mg or 180mg tablet; SR formulations
    compatibility:
    solubility: Excellent lipid solubility
pharmacokinetics:
    absorption: 39% oral bioavailability
    distribution:
        pKa: 7.5
        vd: 5.3L/kg
        protein binding: 80-86%
    metabolism:
        half-life: 2-5 hours
        duration: Exceeds plasma half-life
        pathway: Hepatic; CYP3A4 substrate and inhibitor
        metabolites:
            - Desacetyldiltiazem (active; 25-50% potency)
    elimination:
        renal: Metabolites
mechanism:
    target:
        - Cardiac and vascular L-type Ca2+ channel
    action: State-dependent block → ↓ AV conduction and arterial/coronary vasodilation
contraindications:
    - Sick sinus syndrome; 2nd or 3rd degree AV block without pacemaker
    - Severe bradycardia
    - Severe ↓ MAP or cardiogenic shock
    - Severe heart failure
    - Acute MI with pulmonary congestion
    - AF/flutter with an accessory pathway
    - Ventricular tachycardia
    - IV beta blocker; IV dantrolene; ivabradine
pregnancy:
    code: C
    justification: Maternal ↓ MAP → fetal hypoxia
pharmacodynamics:
    resp:
    cvs:
        - ↓ SVR
        - ↓ MAP
        - ↓ Afterload
        - ↓ HR
        - ↓ AV conduction
        - Mild ↓ Inotropy
        - Coronary vasodilation
    cns:
        - Headache
    endo:
    msk:
        - Peripheral oedema
        - Flushing
    met:
    ren:
    gu:
    git:
        - Constipation
        - ↓ Lower oesophageal sphincter tone
    haeme:
considerations:
    - Beta blockers or digoxin → bradycardia/AV block
    - Do not crush SR formulations
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Sanofi-Aventis Australia Pty Ltd. Cardizem Australian Product Information. Revised 9 June 2026.
    - Eugia US LLC. Diltiazem Hydrochloride Injection US Prescribing Information. Revised November 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
