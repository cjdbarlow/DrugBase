---
aliases: Minipress
class: Selective α1 antagonist
chemistry: Quinazoline derivative
dose:
    HTN (PO): 0.5mg BD → 3-20mg/day divided
    BPH (PO): 0.5mg BD for 3-7 days → 2mg BD; max 4mg/day
    Raynaud disease (PO): 0.5mg BD → 1-2mg BD
pharmaceutics:
    presentation: 1mg, 2mg or 5mg tablet
    compatibility:
    solubility: Slightly water-soluble; slightly lipid-soluble
pharmacokinetics:
    absorption: 43-69% oral bioavailability (significant first-pass metabolism); bioavailability increased in CCF
    distribution:
        pKa: 8.42
        vd: ~42 L/kg
        protein binding: 92-97%
    metabolism:
        half-life: ~2.5 hours
        duration: 6-8 hours
        pathway: Hepatic; demethylation and conjugation
        metabolites:
            - Inactive metabolites
    elimination:
        renal: Minimal; predominantly biliary (metabolites)
mechanism:
    target:
        - α1 adrenoreceptor
    action: Competitive postsynaptic α1 antagonism → ↓ Gq/IP3/DAG → arterial/venous vasodilation; presynaptic α2 preserved
contraindications:
pregnancy:
    code: B2
    justification:
pharmacodynamics:
    resp:
    cvs:
        - ↓ SVR
        - ↓ Afterload
        - ↓ MAP
        - ↓ Preload (venodilation)
        - Minimal reflex tachycardia
        - Postural ↓ MAP
    cns:
    endo:
    msk:
    met:
    ren:
    gu:
        - ↓ Urethral sphincter/prostatic tone
    git:
    haeme:
considerations:
    - First dose → postural ↓ MAP/syncope; give nocte
    - β blocker/diuretic/other antihypertensive → additive ↓ MAP
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Pfizer Australia Pty Ltd. Minipress Australian Product Information. Version pfpminit11119. Revised 25 November 2019.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
