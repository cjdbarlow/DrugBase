---
aliases:
    - Forxiga
class: SGLT2 inhibitor
chemistry: C-aryl glucoside
dose:
    T2DM/HF/CKD (PO): 5-10mg daily
pharmaceutics:
    presentation: Yellow 10mg film-coated tablet
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 78% oral bioavailability; peak ~2 hours
    distribution:
        pKa:
        vd:
        protein binding: 91%
    metabolism:
        half-life: 12.9 hours
        duration: 24 hours
        pathway: UGT1A9 glucuronidation; minor CYP metabolism
        metabolites:
            - Dapagliflozin 3-O-glucuronide (inactive)
    elimination:
        renal: 75% in urine, <2% unchanged; 21% in faeces, ~15% unchanged
mechanism:
    target:
        - Sodium-glucose cotransporter 2
    action: Reversible competitive SGLT2 inhibition in the proximal tubule → ↓ glucose and Na+ reabsorption → glucosuria, osmotic diuresis and ↑ tubuloglomerular feedback
contraindications:
pregnancy:
    code: D
    justification: Animal studies show developing-kidney toxicity corresponding to the second and third trimesters.
pharmacodynamics:
    resp:
    cvs:
        - ↓ MAP, preload and afterload
        - ↓ Volume overload
    cns:
    endo:
        - ↓ BGL and HbA1c
        - ↓ Insulin requirements
        - Euglycaemic DKA
    msk:
    met:
        - Weight loss
    ren:
        - Glucosuria
        - Osmotic diuresis
        - Transient natriuresis
        - ↓ Intraglomerular pressure
    gu:
        - Genital candidiasis
        - UTI
    git:
    haeme:
        - ↑ Haematocrit
considerations:
    - Risk of euglycaemic DKA. Cease before major surgery or prolonged fasting; restart when stable and eating
    - eGFR <25mL/min/1.73m2 → do not initiate
    - eGFR <45mL/min/1.73m2 → ↓ glucose-lowering effect
    - Volume depletion → ↓ MAP
    - Type 1 DM → avoid (↑ DKA)
    - Severe hepatic impairment → avoid
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - AstraZeneca Pty Ltd. FORXIGA Australian Product Information. Revised 7 May 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
