---
aliases: Precedex
class: Alpha-2 adrenoreceptor agonist
chemistry: Imidazole derivative
dose:
    ICU sedation loading (IV): 1μg/kg over 10-20 minutes if required
    ICU sedation maintenance (IV): 0.2-1μg/kg/hr, titrated to response
    Procedural sedation loading (IV): 1μg/kg over 10-20 minutes
    Procedural sedation maintenance (IV): 0.2-1μg/kg/hr, usually initiated at 0.6μg/kg/hr
pharmaceutics:
    presentation: "Clear, colourless, preservative-free solution 100μg/mL"
    compatibility: Incompatible with amphotericin B and diazepam
pharmacokinetics:
    absorption: Onset 10-15 minutes (IV)
    distribution:
        pKa:
        vd: 118 L
        protein binding: 94%
    metabolism:
        half-life: "t½α 6 minutes; t½β 2 hours"
        duration:
        pathway: Hepatic N-glucuronidation, CYP2A6 hydroxylation and N-methylation
        metabolites: Inactive
    elimination:
        renal: 95% renal (metabolites); 4% faecal
mechanism:
    target:
        - α2 adrenoreceptor
    action: Postsynaptic α2 activation in locus coeruleus → Gi activation → ↑ K+ conductance → hyperpolarisation → sedation; spinal α2 activation → analgesia
contraindications:
pregnancy:
    code: B1
    justification:
pharmacodynamics:
    resp:
        - Minimal respiratory depression
        - Apnoea
        - Airway obstruction
    cvs:
        - Initial transient ↑ SVR and ↑ BP (peripheral vasoconstriction)
        - Followed by ↓ MAP and ↓ HR
        - Rebound ↑ BP on abrupt cessation
        - ↓ CO (sympatholytic effect)
        - Sinus arrest (rapid bolus/high vagal tone)
    cns:
        - Sedation resembling natural sleep
        - Anxiolysis at low dose (anxiogenic at high dose)
        - No reliable amnesia
        - ↓ MAC
        - ↓ SNS outflow
        - Minor analgesic effect (likely related to opioid potentiation and anxiolysis)
    endo:
    msk:
    met:
    ren:
    gu:
    git:
    haeme:
considerations:
    - Rousable sedation
    - Continuous ECG, BP and SpO2 monitoring
    - ↓ Dose in hepatic impairment and age >65
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
