---
aliases: Cordarone
class: Class III antiarrhythmic
chemistry: Iodinated benzofuran
dose:
    Cardiac arrest (IV): 5mg/kg up to 300mg IV
    Arrhythmia (IV): 5mg/kg over 20 minutes-2 hours; then 15mg/kg over 24 hours
    Maintenance (PO): 200mg TDS for 1 week; then 200mg BD for 1 week; then 200mg OD
pharmaceutics:
    presentation: 100mg or 200mg tablet; clear pale-yellow 150mg/3mL injection
    compatibility: 5% glucose only; do not mix with other drugs
    solubility: Highly lipid-soluble; poorly water-soluble
pharmacokinetics:
    absorption: 20-80% oral bioavailability; slow and erratic; Tmax ~4.5 hours
    distribution:
        pKa: 6.56
        vd: 66 L/kg (adipose tissue and muscle accumulation)
        protein binding: 96%
    metabolism:
        half-life: 29 days (mean)
        duration: Delayed by redistribution; maximum Class I/IV effects may take weeks
        pathway: Hepatic CYP3A4 → desethylamiodarone
        metabolites: Desethylamiodarone (active)
    elimination:
        renal: <5% renal; predominantly biliary, skin and lacrimal; not dialysable
mechanism:
    target:
        - IKr potassium channel
        - Inactivated Na+ channel
        - L-type Ca2+ channel
        - β and α adrenoreceptors
    action: IKr block → ↑ APD/QT; Na+ block → ↓ Phase 0; non-competitive β block + L-type Ca2+ block → ↓ SA/AV conduction; α-like activity → ↓ SVR
contraindications:
    - Porphyria
    - Sinus bradycardia or SA block
    - Sick sinus or advanced AV block without pacemaker
    - Thyroid dysfunction
    - TdP-provoking drugs
    - Severe ↓ BP or circulatory collapse (IV)
    - Neonates (benzyl alcohol)
pregnancy:
    code: C
    justification: Long t½; fetal thyroid dysfunction/bradycardia; check neonatal TFTs after exposure
pharmacodynamics:
    resp:
        - Pneumonitis (10% 3-year risk)
        - Pulmonary fibrosis
        - Pleuritis
    cvs:
        - ↓ HR/BP/SVR
        - ↑ QT; TdP uncommon
        - Peripheral venous irritation
        - Rapid IV → ↓ BP (polysorbate 80)
    cns:
        - Corneal microdeposits → blurred vision
        - Sleep disturbance; vivid dreams
        - Peripheral neuropathy
    endo:
        - Hyperthyroidism (1%)
        - Hypothyroidism (6%)
    msk:
        - Photosensitivity
        - Grey skin discolouration
    met:
    ren:
    gu:
    git:
        - Nausea; vomiting
        - Hepatitis; cirrhosis; jaundice
    haeme:
considerations:
    - CYP3A4/2C9/2D6 + P-gp inhibition → ↑ digoxin, statin, warfarin, phenytoin and antiarrhythmic exposure
    - Also exhibits Class I, II, and IV activity
