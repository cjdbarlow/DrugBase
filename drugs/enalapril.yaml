---
aliases: Acetec
class: ACE inhibitor
chemistry: L-proline derivative; dicarboxylate (-COOH)
dose:
    HTN (PO): 5mg OD; usual 10-40mg/day OD-BD
    HF (PO): 2.5mg OD; usual 10-20mg/day OD-BD
    LV dysfunction (PO): 2.5mg BD → 10mg BD
pharmaceutics:
    presentation: 2.5mg, 5mg, 10mg or 20mg tablet
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 60% oral bioavailability; effect maximal ~1 hour; unaffected by food
    distribution:
        pKa: 3.0
        vd:
        protein binding: 50%
    metabolism:
        half-life: Enalaprilat 11 hours
        duration: 24 hours
        pathway: 60% hepatic; prodrug → enalaprilat
        metabolites:
            - Enalaprilat (active)
    elimination:
        renal: 40% excreted unchanged; enalaprilat primarily renal
mechanism:
    target:
        - Angiotensin-converting enzyme (ACE)
    action: ACE zinc-site inhibition → ↓ Ang II and aldosterone; ↑ bradykinin
contraindications:
    - Pregnancy
    - Previous ACE inhibitor-associated, hereditary or idiopathic angioedema
    - Sacubitril/valsartan within 36 hours
    - Aliskiren in diabetes
pharmacodynamics:
    resp:
        - Dry cough
    cvs:
        - ↓ SVR
        - ↓ MAP
        - No reflex ↑ HR
        - ↓ Vascular and myocardial remodelling
    cns:
    endo:
        - Hypoglycaemia (diabetes)
    msk:
    met:
        - ↑ Renin
        - ↑ K+
    ren:
        - ↑ Natriuresis if renal perfusion maintained
        - ↓ GFR/AKI if Ang II-dependent (e.g. renal artery stenosis)
    gu:
    git:
    haeme:
        - Agranulocytosis
        - Thrombocytopenia
considerations:
    - Angioedema (bradykinin-mediated)
    - K+-sparing diuretics/K+ → hyperkalaemia
    - NSAIDs → ↓ effect and AKI
    - ↓ Antihypertensive effect in Black patients
references:
    - Alphapharm Pty Limited trading as Viatris. Acetec Australian Product Information. Revised 27 October 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
