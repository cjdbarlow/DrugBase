---
aliases:
    - Duphalac
class: Osmotic laxative and colonic acidifier
chemistry: Synthetic disaccharide
dose:
    Encephalopathy: 30-45mL PO Q1H until laxation, then 30-45mL TDS-QID
    Constipation: 10-20mL PO daily-BID
pharmaceutics:
    presentation: 10g/15mL oral solution
    compatibility: May mix with water, juice or milk
    solubility: Freely water soluble
pharmacokinetics:
    absorption: Poorly absorbed; reaches colon essentially unchanged
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life:
        duration: Laxation onset 24-48h; encephalopathy response may take ≥48h
        pathway: Colonic bacterial fermentation to low-molecular-weight acids
        metabolites:
            - Low-molecular-weight acids
    elimination:
        renal: ≤3% urinary within 24h; faecal metabolites and unchanged drug
mechanism:
    target:
        - Colonic pH and osmotic load
    action: Bacterial fermentation → acidification traps NH3 as NH4+; osmotic water retention → laxation
contraindications:
    - Mechanical bowel obstruction
    - Galactose-restricted diet
pregnancy:
    code:
    justification:
pharmacodynamics:
    resp:
    cvs:
    cns:
        - ↓ Ammonia burden in hepatic encephalopathy
    endo:
    msk:
    met:
        - Diarrhoea → dehydration, hypernatraemia or hypokalaemia
    ren:
    gu:
    git:
        - Laxation; flatulence, cramps, nausea and diarrhoea
    haeme:
considerations:
    - Other laxatives may falsely suggest an adequate encephalopathy dose
    - Encephalopathy target 2-3 soft stools/day
references:
