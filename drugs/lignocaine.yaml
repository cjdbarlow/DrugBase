---
aliases:
    - Lidocaine
    - Xylocard
class: Class Ib antiarrhythmic; aminoamide local anaesthetic
chemistry: Aminoamide
dose:
    VT (IV): 1-2mg/kg over 1-2 minutes; max 100mg
    Infusion (IV): 2-4mg/min
pharmaceutics:
    presentation: Clear 20mg/mL injection; 100mg/mL infusion concentrate
    compatibility: 5.5% glucose; 0.9% NaCl; Ringer's; sodium bicarbonate; dextran
    solubility: Water-soluble
pharmacokinetics:
    absorption: Oral bioavailability 35%; IV only for arrhythmia
    distribution:
        pKa: 7.9
        vd: 0.9 L/kg
        protein binding: 70%
    metabolism:
        half-life: 10-20 minutes (IV bolus); 45-90 minutes (subcutaneous); 90-120 minutes (terminal)
        duration:
        pathway: Hepatic CYP1A2/3A4 (90-95%); active metabolites
        metabolites:
            - Monoethylglycinexylidide (active)
            - Glycinexylidide (active)
    elimination:
        renal: <10% excreted unchanged
mechanism:
    target:
        - Nav1.5 subunit of voltage-gated sodium channel
    action: Open/inactivated Na+ channel block with rapid dissociation → ↓ Phase 0, automaticity and APD in depolarised/ischaemic ventricular tissue; minimal effect on normal tissue or QRS; ↓ QT
contraindications:
    - Severe SA, AV or intraventricular block
    - Stokes-Adams syndrome
    - Supraventricular arrhythmias
pharmacodynamics:
    resp:
    cvs:
        - AV block
        - ↓ Inotropy/HR/MAP; cardiovascular collapse
    cns:
        - Circumoral tingling; paraesthesia
        - Dizziness; visual disturbance; confusion
        - Seizures; coma
    endo:
    msk:
    met:
    ren:
    gu:
    git:
    haeme:
considerations:
    - Shock, CCF, hepatic disease or prolonged infusion → ↓ clearance
    - Propranolol, metoprolol or cimetidine → ↓ clearance
references:
    - Aspen Pharmacare Australia Pty Ltd. Xylocard Australian Product Information. Revised 26 August 2024.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
