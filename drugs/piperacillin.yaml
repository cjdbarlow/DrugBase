---
aliases:
    - Tazocin
    - Piperacillin/tazobactam
class: Antipseudomonal penicillin
chemistry: Ureidopenicillin; β-lactam
dose:
    Infection (IV): 4g/0.5g piperacillin/tazobactam Q8H
pharmaceutics:
    presentation: 2g/0.25g and 4g/0.5g piperacillin/tazobactam powder for infusion
    compatibility: Reconstitute with water, 0.9% NaCl or 5% glucose; incompatible with Hartmann's and sodium bicarbonate
    solubility:
pharmacokinetics:
    absorption:
    distribution:
        pKa:
        vd:
        protein binding: 21%
    metabolism:
        half-life: 0.7-1.2 hours
        duration:
        pathway: No biotransformation
        metabolites:
    elimination:
        renal: 69% unchanged; filtration and tubular secretion; biliary secretion
mechanism:
    target:
        - Penicillin-binding proteins
        - β-lactamases (tazobactam)
    action: Inhibits peptidoglycan cross-linking → defective bacterial cell wall and lysis; tazobactam inhibits susceptible β-lactamases
contraindications:
pregnancy:
    code: B1
    justification:
pharmacodynamics:
    resp:
    cvs:
    cns:
        - Encephalopathy and convulsions, especially renal failure
    endo:
    msk:
    met:
        - Hypokalaemia
    ren:
        - Interstitial nephritis
        - AKI
    gu:
    git:
        - Diarrhoea; C. difficile colitis
        - ↑ Transaminases
    haeme:
        - Impaired platelet aggregation → bleeding
        - Cytopaenias
considerations:
    - Bactericidal; time-dependent killing
    - Broad Gram-positive, Gram-negative, Pseudomonas and anaerobic activity; tazobactam restores activity against susceptible β-lactamases
    - 224mg sodium/4g piperacillin vial
    - Renal impairment → dose reduction
    - Do not mix with aminoglycosides; administer separately
    - Probenecid ↓ tubular secretion; piperacillin ↓ methotrexate excretion
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Fresenius Kabi Australia Pty Limited. PIPERACILLIN/TAZOBACTAM KABI Australian Product Information. Revised 11 February 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
