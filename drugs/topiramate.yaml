---
aliases:
    - Topamax
class: Anticonvulsant; migraine prophylaxis
chemistry: Sulfamate-substituted monosaccharide
dose:
    Monotherapy (PO): 25mg nocte for 1 week; ↑ 25-50mg/week; target 100mg/day, max 500mg/day
    Adjunct (PO): 25-50mg nocte for 1 week; ↑ 25-100mg/week; target 200-400mg/day, max 1g/day
    Migraine (PO): 25mg nocte for 1 week; ↑ 25mg/week; target 100mg/day in 2 doses
pharmaceutics:
    presentation: 25mg, 50mg, 100mg and 200mg tablets; 15mg, 25mg and 50mg sprinkle capsules
    compatibility:
    solubility: Water solubility 9.8mg/mL; solubility ↑ in alkaline solution
pharmacokinetics:
    absorption: Rapid; ≥81% absorbed; peak 2-3 hours; food has no significant effect
    distribution:
        pKa:
        vd: 0.55-0.8L/kg
        protein binding: 13-17%
    metabolism:
        half-life: 21 hours
        duration:
        pathway: Hydroxylation, hydrolysis and glucuronidation; ~20%, rising to 50% with enzyme inducers
        metabolites:
            - Six metabolites with little or no activity
    elimination:
        renal: ≥81%; 66% unchanged
mechanism:
    target:
        - Voltage-gated Na+ channels
        - GABA-A receptors
        - Kainate/AMPA receptors
        - Carbonic anhydrase
    action: ↓ Repetitive firing, ↑ GABA-A activity and ↓ glutamatergic excitation; weak carbonic anhydrase inhibition
contraindications:
    - Migraine prophylaxis in pregnancy or without highly effective contraception
pregnancy:
    code: D
    justification: Can cause fetal harm; ↑ congenital malformations
pharmacodynamics:
    resp:
    cvs:
    cns:
        - Anticonvulsant
        - Paraesthesia and cognitive slowing
        - Somnolence, fatigue and dizziness
    endo:
    msk:
    met:
        - ↓ Appetite and weight
        - Hyperchloraemic non-anion-gap metabolic acidosis
    ren:
        - Nephrolithiasis
    gu:
    git:
        - Nausea and diarrhoea
    haeme:
considerations:
    - Renal impairment → halve starting and maintenance doses
    - Acute myopia and secondary angle closure glaucoma, usually within 1 month
    - Oligohidrosis and hyperthermia, especially in children or hot weather
    - Hyperammonaemia ± encephalopathy, especially with valproate
    - ≥200mg/day may ↓ ethinylestradiol exposure
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Janssen-Cilag Pty Ltd. TOPAMAX Australian Product Information. Version 27.240626. Revised 18 February 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
