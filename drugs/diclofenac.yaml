---
aliases:
class: Non-selective COX inhibitor
chemistry: Hetero-aryl acetic acid
dose:
    Analgesia: 50mg PO/PR BD/TDS
pharmaceutics:
    presentation:
    compatibility:
    solubility: "pKa 4.2; quite lipid soluble and minimally water soluble"
pharmacokinetics:
    absorption: Approximately 65% oral bioavailability; rapidly absorbed
    distribution:
        pKa: 4.2
        vd: 1.4 L/kg
        protein binding: 99%
    metabolism:
        half-life: 1.2 hours
        duration:
        pathway: Hepatic; 70% to water-soluble inactive metabolites; 30% biliary excretion → enterohepatic recirculation
        metabolites:
    elimination:
        renal: 70% renal elimination of inactive metabolites; 30% biliary elimination (enterohepatic recirculation)
mechanism:
    target:
        - COX-1
        - COX-2
    action: Inhibition of COX-1 and COX-2 → ↓ prostaglandin synthesis → ↓ vascular response to inflammation and ↓ sensitivity of peripheral nociceptors; COX-1 inhibition → dysregulation of PGI2 antithrombotic effects and ↓ gastric bicarbonate and mucus secretion
contraindications:
pharmacodynamics:
    resp:
        - Bronchospasm in approximately 20% of asthmatics
    cvs:
        - Risk of MI similar to COX-2 inhibitors
        - Local thrombus with IV injection
        - CCF exacerbation
        - Hypertension
    cns:
    endo:
    msk:
    met:
    ren:
        - Acute kidney injury (microvascular renal dysfunction)
    gu:
    git:
        - GI ulceration
    haeme:
        - Platelet dysfunction
        - ↑ Perioperative bleeding risk
        - Transaminitis
considerations:
references:
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - TGA PI document
