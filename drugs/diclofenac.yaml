---
aliases: Voltaren
class: Non-selective COX inhibitor
chemistry: Heteroaryl acetic acid
dose:
    Analgesia (PO/PR): 50mg BD/TDS; max 150mg/day
pharmaceutics:
    presentation: 25mg or 50mg EC tablet; 12.5-100mg suppository
    compatibility:
    solubility: "pKa 4.2; quite lipid soluble and minimally water soluble"
pharmacokinetics:
    absorption: Rapid; 50-65% oral bioavailability
    distribution:
        pKa: 4.2
        vd: 1.4 L/kg
        protein binding: 99%
    metabolism:
        half-life: 1-2 hours
        duration:
        pathway: CYP2C9 → 4-hydroxydiclofenac; glucuronidation and sulfation
        metabolites: 4-hydroxydiclofenac
    elimination:
        renal: 60-70% urine; 30-35% biliary/faecal; enterohepatic recirculation
mechanism:
    target:
        - COX-1
        - COX-2
    action: Reversible COX-1/2 inhibition → ↓ prostaglandin synthesis → ↓ inflammation and nociceptor sensitisation
contraindications:
    - NSAID-induced asthma, angioedema or urticaria
    - Active GI ulcer, bleeding or perforation
    - Severe cardiac, renal or hepatic failure
    - CABG peri-operative pain
    - Third-trimester pregnancy
    - Proctitis (PR)
pharmacodynamics:
    resp:
        - Bronchospasm (~20% of asthmatics)
    cvs:
        - ↑ MI/CVA risk; similar to COX-2 inhibitors
        - IV → local thrombosis
        - ↑ BP; oedema; CCF exacerbation
    cns:
    endo:
    msk:
    met:
        - Transaminitis
    ren:
        - ↓ GFR; AKI
    gu:
    git:
        - GI ulceration/bleeding
    haeme:
        - Platelet dysfunction
        - ↑ Perioperative bleeding risk
considerations:
    - Synovial persistence → effect outlasts plasma t½
references:
    - Novartis Pharmaceuticals Australia Pty Limited. Voltaren Tablets and Suppositories Australian Product Information. Revised 17 November 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
