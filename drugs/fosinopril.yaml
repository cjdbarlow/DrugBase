---
aliases: Monopril
class: ACE inhibitor
chemistry: L-proline derivative; phosphoryl (-PO2)
dose:
    HTN (PO): 10mg OD; usual 20-40mg OD; up to 80mg/day
    HF (PO): 10mg OD; usual 20-40mg OD; max 40mg/day
pharmaceutics:
    presentation: 10mg, 20mg or 40mg tablet
    compatibility:
    solubility: Water-soluble
pharmacokinetics:
    absorption: 32% oral bioavailability; effect maximal ~1 hour; food slows absorption
    distribution:
        pKa: 4.3
        vd: 0.8-1.1L/kg
        protein binding: Fosinoprilat 99.4%
    metabolism:
        half-life: Fosinoprilat 11.5 hours
        duration:
        pathway: 50% hepatic; prodrug → fosinoprilat
        metabolites:
            - Fosinoprilat (active)
            - Glucuronide conjugate (inactive)
    elimination:
        renal: 50% excreted unchanged; balanced renal/hepatobiliary clearance
mechanism:
    target:
        - Angiotensin-converting enzyme (ACE)
    action: ACE zinc-site inhibition → ↓ Ang II and aldosterone; ↑ bradykinin
contraindications:
    - Pregnancy
    - Previous ACE inhibitor-associated angioedema
    - Aliskiren in diabetes
pharmacodynamics:
    resp:
        - Dry cough
    cvs:
        - ↓ SVR
        - ↓ MAP
        - No reflex ↑ HR
        - ↓ Vascular and myocardial remodelling
    cns:
    endo:
        - Hypoglycaemia (diabetes)
    msk:
    met:
        - ↑ Renin
        - ↑ K+
    ren:
        - ↑ Natriuresis if renal perfusion maintained
        - ↓ GFR/AKI if Ang II-dependent (e.g. renal artery stenosis)
    gu:
    git:
    haeme:
        - Agranulocytosis
        - Thrombocytopenia
considerations:
    - Angioedema (bradykinin-mediated)
    - K+-sparing diuretics/K+ → hyperkalaemia
    - NSAIDs → ↓ effect and AKI
    - ↓ Antihypertensive effect in Black patients
    - Clearance partly preserved in renal failure
references:
    - Chartwell RX, LLC. Fosinopril Sodium Tablets USP US Prescribing Information. Revised October 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
