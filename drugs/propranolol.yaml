---
aliases: Inderal; Cardinol
class: Non-selective β blocker
chemistry: Aryloxypropanolamine; racemate
dose:
    HTN (PO): 40mg BD; usual 120-320mg/day
    Arrhythmia/thyrotoxicosis (PO): 10-40mg TDS-QID
    Arrhythmia (IV): 1mg boluses; usual total 1-3mg
    Paediatric arrhythmia (PO): 0.25-0.5mg/kg TDS-QID
pharmaceutics:
    presentation: 10mg or 40mg tablet; 160mg LA capsule; clear 1mg/mL injection
    compatibility:
    solubility: Highly lipid-soluble
pharmacokinetics:
    absorption: 30% oral bioavailability
    distribution:
        pKa: 9.45
        vd: 4 L/kg
        protein binding: 95%
    metabolism:
        half-life: 3-6 hours
        duration:
        pathway: Extensive first-pass hepatic metabolism
        metabolites:
            - 4-hydroxypropranolol (active; oral only)
            - Inactive metabolites
    elimination:
        renal: 95-100% as metabolites/conjugates in urine
mechanism:
    target:
        - β1 adrenoreceptor
        - β2 adrenoreceptor
    action: Competitive β1/β2 antagonism → ↓ Gs-mediated cAMP; membrane-stabilising activity
contraindications:
    - Asthma, bronchospasm or airway obstruction
    - Sinus bradycardia or sick sinus
    - Second/third-degree AV block
    - Shock or CCF
    - Hypotension
    - Severe PVD
    - Prolonged fasting/hypoglycaemia
    - Untreated phaeochromocytoma
pregnancy:
    code: C
    justification: Fetal/neonatal bradycardia
pharmacodynamics:
    resp:
        - Bronchospasm
    cvs:
        - ↓ HR
        - ↓ Inotropy
        - ↓ MVO2
        - ↓ MAP
        - ↑ SVR (β2 effect)
        - Bradycardia/AV block
    cns:
        - Tiredness
        - Nightmares
        - Sleep disturbance
    endo:
        - ↓ T4 → T3 conversion
    msk:
    met:
        - ↓ Insulin release
        - Blunted hypoglycaemic response
    ren:
    gu:
    git:
    haeme:
considerations:
    - Verapamil/diltiazem → severe bradycardia/AV block/↓ inotropy
    - Abrupt withdrawal → angina, arrhythmia or MI
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Atnahs Pharma Australia Pty Ltd. Inderal Australian Product Information. Revised 29 July 2025.
