---
aliases: Dilatrend
class: Non-selective β blocker; α1 blocker
chemistry: Aryloxypropanolamine; racemate
dose:
    HTN (PO): 12.5mg OD for 2 days → 25mg OD; max 50mg/day
    HF (PO): 3.125mg BD; double every ≥2 weeks; max 25mg BD (50mg BD if >85kg with mild/moderate HF)
pharmaceutics:
    presentation: 6.25mg, 12.5mg or 25mg tablet
    compatibility:
    solubility: Good lipid solubility
pharmacokinetics:
    absorption: 25-35% oral bioavailability
    distribution:
        pKa: 8.77
        vd: 2 L/kg
        protein binding: 95%
    metabolism:
        half-life: 7-10 hours
        duration:
        pathway: Hepatic oxidation/glucuronidation; CYP2D6/CYP2C9
        metabolites:
            - Three active metabolites
    elimination:
        renal: Mainly biliary/faecal; minor renal elimination
mechanism:
    target:
        - β1 adrenoreceptor
        - β2 adrenoreceptor
        - α1 adrenoreceptor
    action: Competitive β/α1 antagonism → ↓ cAMP + vasodilation; membrane-stabilising activity
contraindications:
    - Bronchospasm, asthma or COPD
    - Severe sinus bradycardia or sick sinus
    - Second/third-degree AV block
    - Shock or decompensated CCF requiring IV inotrope
    - SBP <85mmHg
    - Hepatic impairment
pregnancy:
    code: C
    justification: Fetal/neonatal bradycardia
pharmacodynamics:
    resp:
        - Bronchospasm
    cvs:
        - ↓ HR
        - ↓ Inotropy
        - ↓ MVO2
        - ↓ MAP
        - ↓ SVR
    cns:
        - Tiredness/nightmares/sleep disturbance
    endo:
    msk:
    met:
        - ↓ Insulin release
        - Masked hypoglycaemia
    ren:
        - ↓ Renin
    gu:
    git:
    haeme:
considerations:
    - Give with food → ↓ orthostasis
    - Verapamil/diltiazem → severe bradycardia/AV block/↓ inotropy
    - Abrupt withdrawal → angina, arrhythmia or MI
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Pharmaco (Australia) Ltd. Dilatrend Australian Product Information. Version 2024-07 v3.2. Revised 9 July 2024.
