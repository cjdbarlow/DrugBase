---
aliases:
class: Beta blocker
chemistry: Aryloxypropanolamine
dose:
    hypertension (PO): 100-800mg PO BD
    hypertension (IV): 10-20mg IV then 20-80mg Q30 min up to 300mg; or 1-2mg/min infusion
pharmaceutics:
    presentation:
    compatibility:
    solubility:
pharmacokinetics:
    absorption: 10-80% oral bioavailability (highly variable due to first pass)
    distribution:
        pKa: 9.3
        vd: 3-16 L/kg
        protein binding: 50%
    metabolism:
        half-life: 3-4 hours
        duration:
        pathway: Mainly hepatic (extensive first pass)
        metabolites:
    elimination:
        renal: Minimal renal excretion
mechanism:
    target:
        - β1 adrenoreceptor
        - β2 adrenoreceptor
        - α1 adrenoreceptor
    action: Racemic mixture of 4 stereoisomers (one pharmacologically active); competitive non-selective β and selective α1 antagonist with membrane stabilising activity; β:α blockade ratio 3:1 (PO) and 7:1 (IV).
contraindications:
pregnancy:
    code: C
    justification: Fetal/neonatal bradycardia
pharmacodynamics:
    resp:
        - Bronchospasm
    cvs:
        - ↓ SVR
        - ↓ BP
        - Does not tend to ↓ HR or ↓ CO acutely
    cns:
        - Orthostatic dizziness
    endo:
    msk:
    met:
    ren:
    gu:
    git:
    haeme:
considerations:
