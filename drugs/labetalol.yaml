---
aliases: Labetalol SXP
class: Non-selective β blocker; α1 blocker
chemistry: Aryloxypropanolamine; 4 stereoisomers (S,R α-blocker; R,R β-blocker; 2 relatively inactive)
dose:
    HTN (PO): 100-800mg BD
    Severe HTN (IV): 20mg → 40mg → 80mg q10-20min; max 300mg/day
    Severe HTN (IV infusion): 2mg/min; usual total 50-200mg; max 300mg/day
    Pregnancy HTN (IV infusion): 20mg/hour; ↑ by 20mg/hour q20min; max 160mg/hour and 300mg/day
pharmaceutics:
    presentation: 50mg, 100mg, 200mg or 400mg tablet; clear 100mg/20mL injection
    compatibility: 0.9% NaCl; 5% glucose; Hartmann's; incompatible with 4.2% NaHCO3
    solubility: Fair lipid solubility
pharmacokinetics:
    absorption: 10-80% oral bioavailability (highly variable due to first pass)
    distribution:
        pKa: 9.3
        vd: 3-16 L/kg
        protein binding: 50%
    metabolism:
        half-life: 3-8 hours
        duration:
        pathway: Hepatic glucuronidation; extensive first pass
        metabolites:
            - Inactive glucuronides
    elimination:
        renal: Glucuronides excreted in urine and bile/faeces; minimal unchanged drug
mechanism:
    target:
        - β1 adrenoreceptor
        - β2 adrenoreceptor
        - α1 adrenoreceptor
    action: Competitive β/α1 antagonism → ↓ cAMP + vasodilation; β:α 3:1 PO/~7:1 IV; membrane-stabilising activity
contraindications:
    - Asthma or COPD
    - Sinus bradycardia or sick sinus
    - Second/third-degree AV block
    - Cardiogenic shock or symptomatic CCF
    - Hypotension
    - Severe PVD
    - Metabolic acidosis
    - Untreated phaeochromocytoma
pregnancy:
    code: C
    justification: Fetal/neonatal bradycardia
pharmacodynamics:
    resp:
        - Bronchospasm
    cvs:
        - ↓ SVR
        - ↓ MAP
        - HR/CO largely maintained acutely
    cns:
        - Orthostatic dizziness
    endo:
    msk:
    met:
        - ↓ Insulin release
        - Masked hypoglycaemia
    ren:
        - ↓ Renin
    gu:
    git:
    haeme:
considerations:
    - Keep supine during IV administration
    - Rare severe hepatocellular injury; do not re-start after injury
    - Verapamil/diltiazem → severe bradycardia/AV block/↓ inotropy
    - Abrupt withdrawal → angina, arrhythmia or MI
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
