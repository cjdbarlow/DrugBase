---
aliases: Nimotop
class: Dihydropyridine calcium channel blocker
chemistry: 1,4-dihydropyridine
dose:
    SAH (PO/NG): 60mg Q4H for 21 days
    SAH (IV): 15mcg/kg/hr (1mg/hr) for 2 hours; then 30mcg/kg/hr (2mg/hr)
    <70kg or labile MAP (IV): 0.5mg/hr; max 1mg/hr
pharmaceutics:
    presentation: 30mg tablet; 0.2mg/mL IV concentrate
    compatibility: No PVC; use polyethylene or polypropylene; co-infuse 1:4
    solubility: Excellent lipid solubility; high CNS penetration
pharmacokinetics:
    absorption: 11.6% oral bioavailability; Tmax 0.6-1.6 hours
    distribution:
        pKa: 5.4
        vd: 1.7L/kg
        protein binding: 98%
    metabolism:
        half-life: 1.2-1.8 hours IV; 5-10 hours PO
        duration: Exceeds plasma half-life
        pathway: Hepatic; CYP3A4
        metabolites:
            - Inactive or substantially less active metabolites
    elimination:
        renal: 50% as metabolites
        faecal: 30% as metabolites
mechanism:
    target:
        - Cerebral vascular L-type Ca2+ channel
    action: Lower cerebral vascular smooth-muscle resting potential → preferential L-type Ca2+ channel block and vasodilation
contraindications:
    - Rifampicin (PO)
    - Phenobarbital; phenytoin; carbamazepine (PO)
pregnancy:
    code: C
    justification: Maternal ↓ MAP → fetal hypoxia
pharmacodynamics:
    resp:
    cvs:
        - ↓ MAP
        - Tachycardia or bradycardia
    cns:
        - ↓ Cerebral vascular resistance
        - Improved neurological outcomes after SAH
        - Headache
    endo:
    msk:
    met:
    ren:
    gu:
    git:
        - Nausea
        - Ileus
    haeme:
        - Thrombocytopenia
considerations:
    - Phlebitis
    - Severe hepatic impairment → 50% dose
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Boucher & Muir Pty Ltd. Nimotop Australian Product Information. Revised 30 January 2026.
