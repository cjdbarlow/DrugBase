---
aliases:
    - Mexitil
class: Class Ib antiarrhythmic
chemistry: Lignocaine analogue
dose:
    Ventricular arrhythmia (PO): 200-300mg Q8H; max 1.2g/day
    Loading (PO): 400mg, then 200mg after 8 hours
pharmaceutics:
    presentation: 150mg, 200mg and 250mg capsules
    compatibility:
    solubility: Freely water- and alcohol-soluble; pKa 9.2
pharmacokinetics:
    absorption: ~90% oral bioavailability; peak 2-3 hours
    distribution:
        pKa: 9.2
        vd: 5-7L/kg
        protein binding: 50-60%
    metabolism:
        half-life: 10-12 hours
        duration:
        pathway: Hepatic CYP2D6 and CYP1A2
        metabolites:
            - Inactive hydroxylated and conjugated metabolites
    elimination:
        renal: ~10% unchanged; urinary acidification ↑ excretion
mechanism:
    target:
        - Activated and inactivated cardiac Na+ channels
    action: Rapid use-dependent Na+ channel blockade → ↓ phase 0 upstroke and action-potential duration in ventricular tissue
contraindications:
    - Cardiogenic shock
    - Second- or third-degree AV block without a pacemaker
pregnancy:
    code: B1
    justification:
pharmacodynamics:
    resp:
    cvs:
        - ↓ Ventricular automaticity
        - Minimal effect on QRS and QT
        - Proarrhythmia
    cns:
        - Tremor
        - Dizziness
        - Ataxia
        - Visual disturbance
    endo:
    msk:
    met:
    ren:
    gu:
    git:
        - N/V
        - Heartburn
    haeme:
considerations:
    - Give with food or antacid
    - Therapeutic plasma concentration 0.5-2µg/mL
    - Severe hepatic impairment or right heart failure → ↑ half-life
    - Initiate in hospital for life-threatening ventricular arrhythmia
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - AvKARE. Mexiletine Hydrochloride Capsules USP official US label. Revised January 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
