---
aliases:
    - Chlorhexidine gluconate
class: Antiseptic and disinfectant
chemistry: Cationic bisbiguanide
dose:
    Wound: Water rinse; 0.1% just to cover wound; gentle wash; thorough rinse
    Catheterisation: Thorough external genital irrigation with 0.2% before bladder catheterisation
pharmaceutics:
    presentation: 0.1% and 0.2% sterile blue irrigation solution
    compatibility: External irrigation only; hypotonic and haemolytic
    solubility: Gluconate solution is miscible with water
pharmacokinetics:
    absorption: Negligible topical absorption
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life:
        duration: Persistent residual skin activity with repeated use
        pathway:
        metabolites:
    elimination:
        renal:
mechanism:
    target:
        - Microbial cell membranes
    action: Membrane adsorption → leakage of small molecules and precipitation of cytoplasmic proteins
contraindications:
    - Brain, meninges, eyes or perforated eardrum irrigation
    - Body-cavity irrigation or enema
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - Anaphylaxis
    cvs:
    cns:
        - Neurotoxicity with neural exposure; deafness with middle-ear exposure
    endo:
    msk:
    met:
    ren:
    gu:
        - Haematuria after bladder irrigation
    git:
    haeme:
        - Haemolysis if injected IV
considerations:
    - More active against Gram-positive organisms; not sporicidal at room temperature
    - Neonatal irritation and chemical burns, especially premature infants
    - Selected irrigation product not for pre-op face/head skin preparation
    - Irreversible corneal injury after eye exposure
references:
