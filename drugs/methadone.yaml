---
aliases: Methadone-AFT
class: Opioid
chemistry: Synthetic phenylheptylamine; racemate
dose:
    Analgesia: Initially 5-10mg PO Q6-8H; chronic use ≤BD
pharmaceutics:
    presentation: 5mg, 10mg tablets
    compatibility:
    solubility: pKa 9.2; octanol-water partition coefficient ~117; 1% unionised at pH 7.4
pharmacokinetics:
    absorption: 80% PO bioavailability; wide interindividual variation
    distribution:
        pKa: 9.2
        vd: 1-8L/kg
        protein binding: 85-90%
    metabolism:
        half-life: 20-60h
        duration: Respiratory effects >24h
        pathway: Hepatic N-demethylation/cyclisation; CYP3A4/CYP2B6
        metabolites: EDDP (inactive)
    elimination:
        renal: Urine/faeces; renal clearance ↑ at >55mg/day and with acidic urine
mechanism:
    target:
        - μ-opioid receptor (MOP)
        - NMDA receptor
        - Monoamine reuptake transporters
    action: MOP agonism + NMDA antagonism/monoamine reuptake inhibition; Gi → ↓ presynaptic Ca²⁺ influx/cAMP; ↑ postsynaptic K⁺ efflux → hyperpolarisation
contraindications:
    - Respiratory depression/severe or acute respiratory disease
    - Obstructive airways disease/acute asthma
    - MAOI within 2 weeks
    - Acute alcoholism
    - Head injury/↑ ICP
    - Ulcerative colitis
    - Severe hepatic impairment
    - Biliary/renal tract spasm
    - QT prolongation
pregnancy:
    code: C
    justification: Neonatal respiratory depression; withdrawal with prolonged use
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO₂ → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO₂
    cvs:
        - ↓ HR
        - May ↓ MAP via histamine release
        - ↑ PVR
        - ↑ QTc → torsades de pointes
    cns:
        - Sedation/euphoria
        - Nausea/vomiting via CTZ
        - Miosis via Edinger-Westphal nucleus
        - ↓ MAC up to 90%
    endo:
    msk:
        - Muscle rigidity
        - Pruritus, especially intrathecal
    met:
        - ↓ ACTH/gonadotrophins; ↑ prolactin
        - ↑ ADH
    ren:
        - ↑ ADH
        - ↑ Ureteric/sphincter tone
    gu:
    git:
        - ↓ Peristalsis/GIT secretions → constipation
    haeme:
considerations:
    - Long, variable, dose-dependent half-life → accumulation
    - Respiratory depression outlasts analgesia
    - Numerous CYP/QT-prolonging interactions
    - Impaired chemotaxis, lymphocyte proliferation and antibody production
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - AFT Pharmaceuticals Pty Ltd. METHADONE-AFT Australian Product Information. First approved 27 February 2023.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
