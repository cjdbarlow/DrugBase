---
aliases: Rapifen
class: Opioid
chemistry: Synthetic phenylpiperidine opioid
dose:
    Analgesia (IV): Up to 7μg/kg; increments 2-3μg/kg every 10-15 minutes
    Laryngoscopy (IV): 20-50μg/kg
    Infusion (IV): 0.5-1μg/kg/min
pharmaceutics:
    presentation: Clear, colourless solution; 0.5mg/mL in 2 or 10mL ampoules
    compatibility: Compatible with 0.9% NaCl, 5% glucose and compound sodium lactate
    solubility: "pKa 6.5; octanol-water partition coefficient 128; 90x more lipid soluble than morphine; 90% unionised at pH 7.4"
pharmacokinetics:
    absorption: IV; maximal analgesia ~1 minute
    distribution:
        pKa: 6.5
        vd: 0.4-1 L/kg
        protein binding: 92%
    metabolism:
        half-life: 90-111 minutes
        duration: 5-10 minutes
        pathway: Hepatic N- and O-dealkylation to inactive metabolites
        metabolites: Inactive
    elimination:
        renal: Renal elimination of metabolites
mechanism:
    target:
        - μ-opioid receptor (MOP)
    action: Gi/o activation → ↓ adenylyl cyclase and cAMP; ↑ postsynaptic K+ conductance and ↓ presynaptic Ca2+ influx → hyperpolarisation and ↓ neurotransmitter release
contraindications:
pharmacodynamics:
    resp:
        - ↓ CNS sensitivity to CO2 → ↓ RR and ↓ VT (↓ RR > ↓ VT)
        - ↑ Reliance on hypoxic drive
        - Respiratory depression potentiated by high FiO2
    cvs:
        - ↓ HR
        - ↑ PVR
    cns:
        - Sedation
        - Euphoria
        - Nausea and vomiting due to CTZ stimulation
        - Miosis (stimulation of Edinger-Westphal nucleus)
        - ↓ MAC up to 90%
    endo:
    msk:
        - Muscle rigidity
        - Pruritus
    met:
        - ↓ ACTH, gonadotrophins, cortisol and testosterone; ↑ prolactin
    ren:
        - ↑ ADH
        - ↑ Ureteric and bladder sphincter tone → urinary retention
    gu:
    git:
        - ↓ Peristalsis and GIT secretions → constipation
    haeme:
considerations:
    - Shorter t½ than fentanyl despite lower clearance due to smaller Vd
    - Midazolam prolongs effect via CYP3A3/4 competition
    - Low pKa and larger dose → rapid onset despite lower lipid solubility than fentanyl (Bowman's Principle)
    - "Equianalgesic dose (IV): 1mg = 10mg IV morphine"
references:
    - Piramal Critical Care Pty Ltd. Rapifen Australian Product Information. Revised 26 September 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
    - Petkov V. Essential Pharmacology For The ANZCA Primary Examination. Vesselin Petkov. 2012.
    - ANZCA July/September 2010
    - Schug SA, Palmer GM, Scott DA, Halliwell R, Trinca J. Acute Pain Management: Scientific Evidence. 4th Ed. 2015. ANZCA and Faculty of Pain Medicine.
