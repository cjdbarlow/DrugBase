---
aliases:
    - Samsca
class: Vasopressin receptor antagonist
chemistry: Benzazepine
dose:
    hyponatraemia: 15mg PO OD; ↑ to 30mg then 60mg at ≥24h intervals; max 30 days
pharmaceutics:
    presentation: 15mg or 30mg tablets
    compatibility:
    solubility: Practically insoluble in water; pKa 13.4
pharmacokinetics:
    absorption: 56% PO bioavailability; Tmax ~2 hours; food unaffected
    distribution:
        pKa: 13.4
        vd: 3L/kg
        protein binding: 99%
    metabolism:
        half-life: 12 hours
        duration: ~24 hours
        pathway: Hepatic; CYP3A
        metabolites:
    elimination:
        renal: 59% faeces; 40% urine; <1% unchanged in urine
mechanism:
    target:
        - V2 receptor
    action: V2 antagonism → ↓ aquaporin-2 insertion → ↑ electrolyte-free water excretion
contraindications:
    - Hypovolaemic hyponatraemia
    - Anuria
    - Unable to sense/respond to thirst
    - Urgent Na+ correction
    - Strong CYP3A inhibitors
pregnancy:
    code: D
    justification: Animal studies → embryofetal death/malformations with maternal toxicity
pharmacodynamics:
    resp:
    cvs:
    cns:
    endo:
    msk:
    met:
        - ↑ Na+
        - ↑ K+
        - Thirst
    ren:
        - ↑ Free water excretion
    gu:
    git:
        - ↑ LFTs
    haeme:
considerations:
    - Initiate/re-initiate in hospital; avoid fluid restriction for 24h
    - Na+ correction >12mmol/L/24h → osmotic demyelination
    - Liver injury; avoid underlying liver disease
    - CYP3A substrate; avoid grapefruit
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Otsuka Australia Pharmaceutical Pty Ltd. SAMSCA Australian Product Information. Revised 20 April 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
