        metabolites:
    elimination:
        renal: Metabolites predominantly renal
mechanism:
    target:
        - Prostaglandin FP receptors
    action: Stimulates myometrium → uterine contraction
contraindications:
    - Active cardiac, pulmonary, renal or hepatic disease
