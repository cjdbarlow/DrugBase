---
aliases:
    - Dalacin C
class: Lincosamide antibiotic
chemistry: Semisynthetic chlorinated lincomycin derivative
dose:
    Infection (IV): 600mg Q6H
pharmaceutics:
    presentation: 150mg/mL solution for IV or IM injection; 2mL and 4mL ampoules
    compatibility: Compatible with 0.9% NaCl and glucose solutions; incompatible with ampicillin, phenytoin, barbiturates, aminophylline, calcium gluconate, magnesium sulfate, ceftriaxone and ciprofloxacin
    solubility: Water-soluble phosphate ester
pharmacokinetics:
    absorption:
    distribution:
        pKa:
        vd:
        protein binding:
    metabolism:
        half-life: 3 hours
        duration:
        pathway: CYP3A4 and CYP3A5 oxidation
        metabolites:
            - Clindamycin sulfoxide
            - N-desmethylclindamycin
    elimination:
        renal: Drug and metabolites
mechanism:
    target:
        - 50S ribosomal subunit
    action: Inhibits bacterial protein synthesis and toxin production
contraindications:
pregnancy:
    code: A
    justification:
pharmacodynamics:
    resp:
        - Neuromuscular blockade
    cvs:
        - Rapid IV injection → ↓ MAP, cardiopulmonary arrest
    cns:
    endo:
    msk:
    met:
    ren:
        - AKI
    gu:
    git:
        - Nausea
        - Diarrhoea; C. difficile colitis
        - ↑ LFTs; jaundice
    haeme:
        - Cytopaenias
considerations:
    - Bacteriostatic or bactericidal depending on concentration and organism
    - Gram-positive cocci and anaerobes; no Gram-negative aerobic activity
    - Excellent bone penetration; negligible CSF penetration despite meningeal inflammation
    - Infuse ≤30mg/min at ≤12mg/mL
    - Potentiates nondepolarising neuromuscular blockade
    - Erythromycin antagonism
