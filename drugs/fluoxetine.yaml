---
aliases:
    - Prozac
    - Zactin
class: Selective serotonin reuptake inhibitor
chemistry: Phenoxyphenylpropylamine
dose:
    Depression (PO): 20mg daily; doses >20mg/day in 2 divided doses; max 80mg/day
    OCD (PO): 20mg daily; usual 20-60mg/day; max 80mg/day
pharmaceutics:
    presentation: 20mg capsules
    compatibility:
    solubility: Poorly water-soluble and lipid-soluble
pharmacokinetics:
    absorption: 80-95%; peak 6-8 hours; food may slightly delay but does not reduce absorption
    distribution:
        pKa: 9.8
        vd: 14-100L/kg
        protein binding: 94%
    metabolism:
        half-life: 1-3 days after acute dosing; 4-6 days with chronic dosing; norfluoxetine 4-16 days
        duration:
        pathway: Extensive hepatic metabolism by CYP2D6 and other CYP pathways
        metabolites:
            - Norfluoxetine (active)
            - Unidentified inactive metabolites
    elimination:
        renal: Metabolites
mechanism:
    target:
        - Serotonin transporter
    action: Selectively inhibits neuronal serotonin reuptake
contraindications:
    - MAOI use within 14 days; wait at least 5 weeks after fluoxetine before an MAOI
    - Pimozide
    - Metoprolol for cardiac failure
pregnancy:
    code: C
    justification: Third-trimester exposure may cause neonatal withdrawal
pharmacodynamics:
    resp:
    cvs:
    cns:
        - Antidepressant
        - Agitation, insomnia, anxiety and tremor
    endo:
        - SIADH and hyponatraemia
    msk:
    met:
        - Weight loss or gain
    ren:
    gu:
        - Sexual dysfunction
    git:
        - Nausea, diarrhoea and anorexia
    haeme:
        - Increased bleeding
considerations:
    - Serotonergic medicines may cause serotonin syndrome
    - Potent CYP2D6 inhibitor with prolonged interaction risk
    - Long half-life requires at least a 5-week MAOI washout
    - Discontinuation symptoms are rare with the long half-life
    - Hepatic impairment requires a lower or less frequent dose
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Alphapharm Pty Ltd trading as Viatris. ZACTIN Australian Product Information. Revised 1 April 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Petkov V. Essential Pharmacology For The ANZCA Primary Examination. Vesselin Petkov. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
