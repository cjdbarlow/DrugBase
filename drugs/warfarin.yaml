---
aliases:
class: Vitamin K antagonist
chemistry: Coumarin derivative
dose:
pharmaceutics:
    presentation:
    compatibility:
    solubility: Practically insoluble in water
pharmacokinetics:
    absorption: ~100% oral bioavailability
    distribution:
        pKa: 5.87
        vd: 0.08-0.12 L/kg
        protein binding: 99%
    metabolism:
        half-life: 36-42 hours
        duration:
        pathway: Complete hepatic metabolism; S-isomer metabolised by CYP2C9 to 7-hydroxywarfarin (inactive); also via reductases to warfarin alcohols (minimal anticoagulant activity)
        metabolites: 7-hydroxywarfarin; warfarin alcohols
    elimination:
        renal: Renal and faecal elimination of metabolites; 92% of dose recovered in urine within 1 week; minimal free warfarin renally excreted
mechanism:
    target:
        - Vitamin K epoxide reductase complex 1 (VKORC1)
    action: Interferes with the cyclic interconversion of vitamin K and its 2,3-epoxide, preventing γ-carboxylation of Gla residues on the N-terminal regions of vitamin K-dependent coagulation factors II, VII, IX, and X, as well as anticoagulant proteins C and S, resulting in hepatic synthesis of functionally inactive factors
contraindications:
pregnancy:
    code: D
    justification: 6-9 weeks → embryopathy; later exposure → fetal bleeding/CNS damage; ↑ miscarriage/perinatal bleeding
pharmacodynamics:
    resp:
    cvs:
        - Microthrombi
    cns:
    endo:
    msk:
    met:
        - Less osteoporosis than heparin due to reduced protein binding
    ren:
    gu:
    git:
        - Nausea
        - Vomiting
    haeme:
        - Haemorrhage
        - Skin necrosis
        - Systemic microemboli
        - Calciphylaxis
        - Hypersensitivity reactions
considerations:
    - Onset of anticoagulant effect at 8-12 hours
    - Peak effect at 72 hours due to half-life of existing clotting factors
    - Requires INR monitoring; complicated pharmacokinetics
    - Significant interactions with CYP enzyme inducers and inhibitors
    - Reversal agents — vitamin K, FFP, Prothrombinex
    - Teratogenic
references:
