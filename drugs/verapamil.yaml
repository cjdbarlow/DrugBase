---
aliases: Isoptin
class: Non-dihydropyridine calcium channel blocker
chemistry: Phenylalkylamine; racemate (D-isomer has local anaesthetic activity)
dose:
    SVT (IV): 75-150mcg/kg (usually 5mg) over ≥2 minutes; repeat after 5-10 minutes
    HTN crisis (IV): 0.05-0.1mg/kg/hr; usual max 1.5mg/kg/day
    HTN/angina (PO): 40-120mg TDS
    Rate control (SR): 120-240mg BD
pharmaceutics:
    presentation: 5mg/2mL injection; tablet; oral solution
    compatibility:
    solubility: Excellent lipid solubility
pharmacokinetics:
    absorption: 24% oral bioavailability
    distribution:
        pKa: 8.73
        vd: 3.8L/kg
        protein binding: 84-91%
    metabolism:
        half-life: 4.5-12 hours
        duration: Exceeds plasma half-life
        pathway: Hepatic; CYP3A4 substrate and inhibitor
        metabolites:
            - Norverapamil (active; ~20% potency)
    elimination:
        renal: Metabolites
mechanism:
    target:
        - Cardiac and vascular L-type Ca2+ channel
    action: State-dependent block → ↓ AV conduction, contractility and arterial/coronary tone
contraindications:
    - Cardiogenic shock or decompensated heart failure
    - Sick sinus syndrome; 2nd or 3rd degree AV block without pacemaker
    - Severe ↓ MAP
    - AF/flutter with an accessory pathway
    - Ventricular tachycardia
    - Concurrent IV beta blocker outside ICU
pregnancy:
    code: C
    justification: Maternal ↓ MAP → fetal hypoxia
pharmacodynamics:
    resp:
    cvs:
        - ↓ SVR
        - ↓ MAP
        - ↓ Afterload
        - ↓ HR
        - ↓ AV conduction
        - ↓ Inotropy
        - Coronary vasodilation
    cns:
        - Headache
    endo:
        - Gynaecomastia
    msk:
        - Peripheral oedema
        - Flushing
    met:
    ren:
    gu:
    git:
        - Constipation
    haeme:
considerations:
    - Beta blockers → bradycardia/AV block
    - ↑ Digoxin concentration
    - Prolonged neuromuscular blockade
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 4 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Viatris Pty Ltd. Isoptin Injection Australian Product Information. Revised 17 June 2025.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
    - Peck TE, Hill SA. Pharmacology for Anaesthesia and Intensive Care. 4th Ed. Cambridge University Press. 2014.
