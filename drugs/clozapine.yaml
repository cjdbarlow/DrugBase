---
aliases:
    - Clozaril
    - Clopine
class: Atypical antipsychotic
chemistry: Tricyclic dibenzodiazepine
dose:
    Schizophrenia (PO): 12.5mg daily-BD initially; usual 200-450mg/day divided; max 600mg/day (exceptionally 900mg/day)
pharmaceutics:
    presentation: 25mg and 100mg yellow tablets; 50mg/mL oral suspension
    compatibility:
    solubility:
pharmacokinetics:
    absorption: PO absorption 90-95%; bioavailability 50-60%; steady-state peak 2.1 hours; food has no effect
    distribution:
        pKa:
        vd: 5.4±3.5L/kg
        protein binding: 95%
    metabolism:
        half-life: 12 hours (range 4-66 hours)
        duration:
        pathway: Hepatic CYP1A2 and CYP3A4; minor CYP2C19 and CYP2D6
        metabolites:
            - N-desmethylclozapine (active)
    elimination:
        renal: 50% urine and 30% faeces; trace unchanged
mechanism:
    target:
        - Dopamine D1 and D2 receptors
        - 5-HT receptors
        - Muscarinic receptors
        - Histamine H1 receptors
        - α-adrenoceptors
    action: Weak D1/D2 and potent serotonergic, muscarinic, histaminergic and α-adrenergic antagonism
contraindications:
    - Drug-induced granulocytopenia/agranulocytosis or bone-marrow disorder
    - Unable to undergo regular blood tests
    - Uncontrolled epilepsy
    - Severe renal, cardiac or hepatic disease
    - Circulatory collapse, CNS depression or coma
    - Paralytic ileus
pregnancy:
    code: C
    justification: Adult pharmacological and toxicological effects may occur in the fetus
pharmacodynamics:
    resp:
    cvs:
        - Tachycardia and ↓ MAP
        - Myocarditis and cardiomyopathy
    cns:
        - Antipsychotic
        - Sedation
        - ↓ Seizure threshold
    endo:
    msk:
    met:
        - Weight gain, dyslipidaemia and hyperglycaemia
    ren:
    gu:
    git:
        - Gastrointestinal hypomotility
        - Hypersalivation
    haeme:
        - Neutropenia and agranulocytosis
considerations:
    - WBC/ANC weekly for 18 weeks, monthly thereafter and for 1 month after cessation
    - Interruption >2 days → restart 12.5mg daily-BD
    - Myocarditis risk highest in first month
    - Smoking cessation → ↑ clozapine concentration
    - Concomitant myelosuppressants → avoid
    - Neuroleptic malignant syndrome
references:
    - Therapeutic Goods Administration. Prescribing medicines in pregnancy database. Accessed 8 August 2026. https://www.tga.gov.au/resources/health-professional-information-and-resources/australian-categorisation-system-prescribing-medicines-pregnancy/prescribing-medicines-pregnancy-database
    - Viatris Pty Ltd. CLOZARIL Australian Product Information. Revised 17 July 2026.
    - Brunton LL, Chabner BA, Knollmann BC, eds. Goodman & Gilman's The Pharmacological Basis of Therapeutics. 12th Ed. McGraw-Hill. 2011.
    - Katzung BG, Masters SB, Trevor AJ, eds. Basic & Clinical Pharmacology. 12th Ed. McGraw-Hill. 2012.
    - Smith S, Scarth E, Sasada M. Drugs in Anaesthesia and Intensive Care. 4th Ed. Oxford University Press. 2011.
    - Young P, Psirides A. Wellington ICU Drug Manual. 2nd Ed. Wellington Regional Hospital. 2013.
